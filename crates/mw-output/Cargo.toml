[package]
name = "mw-output"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Third-party HTTPS integrations: the rate-limited outputs, and the Aeris fetchers."

[lints]
workspace = true

[dependencies]
# Workspace crates, by layer (ci/layers.toml).
mw-component.workspace = true
mw-types.workspace = true
mw-aprs.workspace = true
# `Transport`, `ByteStream` and `stream::open` -- and nothing else. The two KISS transports
# are a character device and a socket, and the serial open is the one place in this workspace
# that configures a line: `mw_station::stream::serial` sets 8N1 and the rate through
# `tokio-serial`, which `ci/layers.toml` confines to that crate. A second copy here would be
# a second idea of what 9600 8N1 means. `crate::frame`'s module documentation has the whole
# of that reasoning.
mw-station.workspace = true

tower.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
# The credential on an `uploader` row is a secret from the moment it is read (D-33). It
# leaves `secrecy` in exactly one place -- `encoder::account::Account::preamble` -- and what
# it goes into is `crate::Form`, whose own `Debug` redacts.
secrecy.workspace = true
# The two series of `metrics.rs`. The recorder is `mw-obs`'s; this crate names the series it
# owns (A-W3-1, §5.10).
metrics.workspace = true

# The outbound HTTPS request. `crate::https`'s module documentation has why there is no
# client crate here and why these three are what replace one: `rustls` and `tokio-rustls`
# are already pinned for the listener (A-W8-3, `ring` rather than `aws-lc-rs`), and
# `webpki-roots` is the one addition -- a compiled-in trust store, which is the only kind
# that behaves the same on four cross-compiled targets and inside a container whose
# `/etc/ssl/certs` is the base image's. Recorded as amendment A-M6-2-1 in
# docs/reconciliation.md, because D-32 governs the daemon's dependencies and named no
# client.
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true

# The Aeris payloads. `serde` reads the vendor's eighteen forecast fields and `serde_json`
# parses the envelope and escapes one JSON string at a time -- `crate::aeris::forecast`
# writes the stored array out by hand, because `serde_json` renders an integral `f32` as
# `0.0` where Go's `encoding/json` renders it as `0`, and that text is a frozen response body
# one storage round trip later (docs/service-architecture.md **Decision 39**, which is the
# `/forecast`-caches-the-jsonb-verbatim one -- DESIGN.md's own D-39 is a different decision,
# and the collision across those two lists is one docs/reconciliation.md A-M4-1-1 calls
# systematic in this range).
#
# Neither is a new dependency for the WORKSPACE -- both are `[workspace.dependencies]`
# entries already used by seven crates -- and neither is in DESIGN.md D-32's table, which
# lists no serialisation crate at all. D-32 says an addition is an amendment, so the
# responsibility change that brought this half of the crate into being records it:
# docs/reconciliation.md A-M6-3-2.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `macros` for `#[tokio::test]`, and `test-util` for `start_paused`: the rate limiter's
# "each attempt takes its own permit" property and the `Retry-After` hold are both about
# elapsed time, and a test that slept for them would take eleven minutes.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# `CancellationToken`, to construct the `Cx` a `Tick` body is handed. The library itself
# does not name it: a component observes cancellation through `Cx::cancelled`, which is
# `mw-component`'s surface.
tokio-util.workspace = true
