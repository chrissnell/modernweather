[package]
name = "modernweather"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The ModernWeather daemon."

[lints]
workspace = true

[[bin]]
name = "modernweather"
path = "src/main.rs"

[dependencies]
# Workspace crates, by layer (ci/layers.toml).
mw-types.workspace = true
mw-proto.workspace = true
mw-codec.workspace = true
mw-aprs.workspace = true
mw-obs.workspace = true
mw-component.workspace = true
mw-supervisor.workspace = true
mw-store.workspace = true
mw-pipeline.workspace = true
mw-station.workspace = true
mw-http.workspace = true
mw-api-legacy.workspace = true
mw-web.workspace = true
mw-grpc.workspace = true
mw-output.workspace = true
mw-collector.workspace = true
mw-api-mgmt.workspace = true

anyhow.workspace = true
# `anyhow` at the binary boundary and `thiserror` per module (D-32, §4) -- the boundary is
# not the crate, it is the point where the last answer really is "print it and exit". The
# command line and the listen address are classified errors like any other.
thiserror.workspace = true
tokio.workspace = true
# The supervisor's shutdown is a `CancellationToken` (§3.6) and `main` is what cancels it.
tokio-util.workspace = true
sqlx.workspace = true
tracing.workspace = true
sd-notify.workspace = true
# `mw_build_info` is a fact about this binary, so the one crate that knows its version is
# the one that records it. Every other metric in §5.10's table belongs to the component
# that owns the thing being counted.
metrics.workspace = true
# The weather database's URL is a `SecretString` from the moment it is read (**D-33**), so
# the one place that hands it to a connection has to be able to expose it.
secrecy.workspace = true
# The ingest socket's `ServerConfig` is assembled here, because the verifier's choice is
# per `auth_kind` and the pinned case reads the `peers` snapshot: `mw-http` binds the
# socket and may not name a peer, `mw-collector` decides who may be on it and may not bind
# (ci/layers.toml, §1.4), and the binary is where the two meet (§1.3 rule 1).
rustls.workspace = true
# `Utc::now()` for the snapshot-age sweep the `/metrics` route runs on every scrape
# (M4-1's constraint 2). One clock reading, at the one place §3.3 allows the binary to
# take one: the scrape path is not a component tick.
chrono.workspace = true

[dev-dependencies]
# `Status::unimplemented` for the Go-era collector `tests/collector_two_node.rs` stands up:
# a gRPC server answers `Unimplemented` for a method it does not register, and `axum`'s own
# fallback answers an HTTP 404 that `tonic` cannot read as a status at all -- so a test that
# used the router's default fallback would exercise a shape no Go daemon produces.
tonic.workspace = true
# `Router::new()` for the probe in `tests/boot.rs` that asks `mw_http::bind` for two free
# ports -- `ci/layers.toml` reserves binding for `mw-http` and scans `tests/`, so the probe
# has to go through the real `bind` and therefore needs a router to hand it.
axum.workspace = true
# `test-util` for `tokio::time::pause()`. The stalled-sink test of W3 D-85 is re-pointed at
# a real spool in `tests/spool_fanout.rs`, and it has to live here: `mw-supervisor` and
# `mw-pipeline` are the same layer, so `ci/layers.toml` forbids either naming the other and
# the binary is the only place they meet. Under `resolver = "2"` a dev-dependency feature is
# not unified into `cargo build`, so the shipped artefact does not carry the mock clock.
tokio = { workspace = true, features = ["test-util"] }
# A test-only dependency, for the one literal instant the station-ingest tests hand a
# driver: `FrameMeta::received_at` is a `DateTime<Utc>` and the daemon itself never names
# the type -- every clock it reads belongs to the supervisor or to the spool.
chrono.workspace = true

# Packaging, verbatim from docs/release.md §6, which asks for exactly this block when
# `crates/modernweather` lands. `cargo xtask dist` reads ci/release.toml for the target
# matrix and `cargo deb` / `cargo generate-rpm` read these.
[package.metadata.deb]
maintainer = "Chris Snell <chris.snell@gmail.com>"
depends = ""                      # statically linked; no shared-library dependencies
section = "net"
priority = "optional"
assets = [
  ["target/release/modernweather", "usr/bin/", "755"],
  ["../../packaging/systemd/modernweather.service", "usr/lib/systemd/system/", "644"],
  ["../../packaging/sysusers/modernweather.conf", "usr/lib/sysusers.d/", "644"],
]
conf-files = ["/var/lib/modernweather/config.db"]
maintainer-scripts = "../../packaging/deb"

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/modernweather", dest = "/usr/bin/modernweather", mode = "755" },
  { source = "../../packaging/systemd/modernweather.service", dest = "/usr/lib/systemd/system/modernweather.service", mode = "644" },
  { source = "../../packaging/sysusers/modernweather.conf", dest = "/usr/lib/sysusers.d/modernweather.conf", mode = "644" },
]
pre_install_script = "../../packaging/rpm/preinstall.sh"
post_install_script = "../../packaging/rpm/postinstall.sh"
pre_uninstall_script = "../../packaging/rpm/preremove.sh"
