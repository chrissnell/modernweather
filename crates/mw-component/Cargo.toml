[package]
name = "mw-component"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "W2a's component model as code, and every capability handle trait."

[lints]
workspace = true

[dependencies]
# Workspace crates, by layer (ci/layers.toml).
mw-types.workspace = true

# `Cx` carries a `CancellationToken` and the capability watches are `tokio::sync::watch`
# (D-32: "published snapshots: arc-swap or tokio::sync::watch"). No runtime is started
# here -- that is the supervisor's -- and nothing in this crate spawns.
tokio.workspace = true
tokio-util.workspace = true

tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
# `Resolved` holds an output's declaration table inline (D-59's reason, one level down):
# the largest table in the system is eight rows, so a resolve allocates nothing.
smallvec.workspace = true
# `FrameMeta::presented_secret` is a `SecretString` rather than a `String` (**D-33**): a
# station's `?PASSWORD=` crosses this boundary on its way to a constant-time comparison,
# and the redaction belongs to the type rather than to every log site that might touch it.
secrecy.workspace = true
