[package]
name = "mw-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "sqlx against PostgreSQL and SQLite; owns the pools and the store implementations."

[lints]
workspace = true

[dependencies]
# Workspace crates, by layer (ci/layers.toml).
mw-component.workspace = true
mw-types.workspace = true

sqlx.workspace = true
serde.workspace = true
# The weather database's URL carries a password, so it is a `SecretString` from the moment
# it is read (**D-33**) rather than a `String` that somebody later remembers to redact.
secrecy.workspace = true
chrono.workspace = true
tokio.workspace = true
# The station registry is published as one immutable snapshot and read without a lock
# (D-32, W3 §2a.2): `resolve` is on the admit path, so it is a pointer load rather than a
# mutex a reading waits on.
arc-swap.workspace = true
tracing.workspace = true
thiserror.workspace = true
# An Ambient station's `?PASSWORD=` is verified against the stored `ingest_secret_hash`,
# which is an Argon2id PHC string, and compared in constant time once it has verified
# (D-33). `crate::registry::ConfigRegistry::verify` has the whole of how that is reconciled
# with D-87's "nothing slow on the admit path".
argon2.workspace = true
subtle.workspace = true
# `db:postgres` observes cancellation at an await inside its own `Serve` loop, which A-W6-1
# makes explicitly not a second clock. The token is the supervisor's.
tokio-util.workspace = true

[dev-dependencies]
# `macros` for `#[tokio::test]`. `crates/mw-store/tests/db.rs` and the `db:postgres` body's
# own tests are async; everything else in this crate is not.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
