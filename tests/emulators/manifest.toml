# The emulator manifest. `cargo xtask emulator-tests` reads this file and nothing else;
# `ci/gates.toml` declares it as the gate `driver-emulators`, armed by the existence of
# this file.
#
# Level 3 of the three W3 D-82 specifies — "the whole driver against the pinned Go
# emulator" — and the reason it is a manifest rather than a hard-coded list is D-64: a
# gate's `arms_when` must name a path some work item's done-criteria require it to create,
# and implementation-plan.md M3-1 carries this one. A gate that printed `DEFERRED` and
# exited 0 after this file existed would be docs/reconciliation.md G-1 exactly, so the
# runner asserts that the declared number of tests **passed** — a filter that matches no
# tests exits zero, and that is the hole the count closes.
#
# ---------------------------------------------------------------------------------------
# WHAT THIS MANIFEST HAS TO SAY OUT LOUD
#
# DESIGN.md D-40 keeps the emulators in Go deliberately, because "a driver tested against a
# simulator written in the same language from the same understanding tests that
# understanding against itself", and A-W8-4 adds that they are consumed at a pinned commit
# of the reference repository. `origin` is where each entry stands against that, and it is
# printed on every run rather than buried here:
#
#   reference-vendored  copied from the pinned commit, byte for byte, with every file's
#                       SHA-256 in `[emulator.files]`. Keeps ALL of D-40: a separate
#                       process, a different language, real sockets, the real bind, more
#                       than one batch -- and independent authorship, because the file was
#                       written years before this programme by somebody who was not writing
#                       this driver.
#
#                       Why vendored rather than checked out at test time: that would need
#                       the network and credentials for a private repository during
#                       `cargo test`, which is a test that fails for a reason unrelated to
#                       the driver. The digests are what stop a vendored oracle being
#                       edited until a test passes, which is the realistic failure --
#                       `cargo xtask emulator-tests` refuses an emulator whose files have
#                       moved.
#
#   this-repository     the emulator's BEHAVIOUR is written here, beside the driver. Keeps
#                       everything on that list except independent authorship, so it cannot
#                       catch a misunderstanding the emulator and the driver share.
#
#                       An entry with this origin may STILL carry `[emulator.files]`, and
#                       two do: the snow gauge's and the satellite's generated protobuf
#                       stubs are the reference's own, vendored and digest-verified, so
#                       their PROTOCOL is independently defined and only their numbers are
#                       not. `origin` describes the behaviour; `files` describes which
#                       files came from the pin. `cargo xtask emulator-tests` prints which
#                       half is which on every run.
#
#   reference           checked out of the pinned repository at test time. Nothing is this,
#                       for the reason above; the value exists so that an entry which
#                       becomes one has a name for it.
#
# **The reference repository has exactly two station emulators at that commit**, and both
# are vendored below. Its `cmd/` holds four: `cmd/davis-emulator`,
# `cmd/campbell-emulator`, `cmd/weather-station-simulator` (Davis on TCP 22222 and Campbell
# on TCP 7000) and `cmd/live-data-simulator` (Campbell packets from live data) -- the last
# two being other arrangements of the first two's devices. There is no WeatherLink Live,
# AirGradient, Ambient, snow gauge or satellite emulator there, so those five are written
# here; the repository is read-only to this programme, so one cannot be added there.
#
# **Two emulators are not standard-library-only.** `snowgauge` and `grpcrx` speak gRPC, so
# `go build` needs a populated module cache or the network; each commits its `go.sum`, so the
# build is reproducible but not offline on a machine that has never fetched `grpc-go`. The
# alternative was hand-rolling HTTP/2 and HPACK from the standard library, which would not
# exercise a gRPC client or a gRPC service at all. Recorded here because it is the one
# property the other five have and these two do not.
#
# **For the WeatherLink Live that remains a decision for the programme owner.** The honest
# fix is a `cmd/weatherlink-live-emulator` in the reference tree, written against the vendor
# documentation by somebody who is not writing the driver, with the pin below bumped to the
# commit that adds it -- at which point that entry becomes `reference-vendored` and the
# local copy is deleted. Until then the gate runs real tests and says what they do not
# prove. The same is true of `airgradient` and of `ambient`, and for `ambient` it is
# weaker still: the station is the client, so the emulator is a hundred lines of query
# string and the thing it cannot independently check is the parameter NAMES.
#
# ---------------------------------------------------------------------------------------

# The pinned commit of the reference repository (A-W8-4). Bumping it is a reviewed change:
# the reference is read-only to this programme and is NOT frozen, so an unrelated upstream
# commit could otherwise turn this repository's CI red.
#
# Nothing in this manifest is checked out from it yet — the WeatherLink Live emulator is
# local — so the pin is a commitment the first `origin = "reference"` entry will use rather
# than a path that is read today. `cargo xtask emulator-tests` still validates that it is a
# full 40-character object name, because "pinned" and "pinned to a branch name" are
# different things.
[reference]
repo = "git@github.com:chrissnell/remoteweather.git"
commit = "c3ec9f7d7dec2c5f71a1f48b8af2b9b0921b7bcf"
committed = "2026-10-27"

# ---------------------------------------------------------------------------------------
# The emulators that run today.

[[emulator]]
id = "weatherlink-live"
emulates = "Davis WeatherLink Live — the local API v1 and its UDP broadcast"
driver = "mw_station::wll (implementation-plan.md M3-1)"
origin = "this-repository"
path = "tests/emulators/wll"
package = "mw-station"
test_target = "emulator"
# BY NAME, not by count. A count catches a removed test and a filter that matched nothing;
# it does not catch a rename, and it does not catch tests whose bodies were emptied -- which
# is the realistic path, because that is how a flaky emulator test gets "fixed". Four empty
# `#[ignore]`d functions were shown to produce `ok: 4 test(s) passed` and exit 0 with no
# emulator process ever started, which is why this is a list.
test_names = [
    "the_broadcast_driver_arms_the_unit_and_keeps_receiving",
    "the_poll_driver_produces_a_reading_on_every_occurrence",
    "a_refusal_carrying_two_hundred_fails_the_re_arm",
    "a_unit_that_reports_no_collector_size_stores_no_rainfall",
    "a_port_disagreement_is_reported_rather_than_followed",
]
note = """
Five tests, each asserting something the two levels below it cannot:

  the_broadcast_driver_arms_the_unit_and_keeps_receiving
      nothing arrives before the unit is armed; then twelve datagrams over a real socket,
      with the values moving, so a driver that admitted the first and stalled fails.
  the_poll_driver_produces_a_reading_on_every_occurrence
      four `Tick` occurrences, four readings. This is the Davis "stops polling after one
      batch" defect's own shape, on the transport it was actually on.
  a_refusal_carrying_two_hundred_fails_the_re_arm
      the unit refuses an arming with `200 OK` and a populated `error` body. A client that
      trusted the status line would listen to a port nothing sends to -- a station that
      silently stops reporting. The emulator refuses every fifth arming on purpose.
  a_unit_that_reports_no_collector_size_stores_no_rainfall
      a unit whose records omit `rain_size`. A tip count cannot become a depth without one,
      so rainfall must be absent rather than stored as a count -- which is DEV-8's
      corrective, asserted here against a device that actually omits the field rather than
      against a fixture that was written to.
  a_port_disagreement_is_reported_rather_than_followed
      the unit broadcasts to a port the configuration does not name. The re-arm reports it
      and does not move the listener, which is W2a §4a.5's "shares no state with the
      listener" made observable.

`test_names` is load-bearing in two directions: `cargo xtask emulator-tests` fails unless
every name in it passed, and `cargo test -p xtask` fails unless every name in it exists in
the target. So a removed test, a renamed one, and a filter that matches nothing are each a
red gate, and a half-finished rename is caught without a Go toolchain."""

[[emulator]]
id = "davis"
emulates = "Davis Vantage Pro/Pro2 -- the wake handshake, `LOOP n`, 99-byte records, CRC-16"
driver = "mw_station::davis + mw_codec::DavisLoop (implementation-plan.md M6-1)"
origin = "reference-vendored"
path = "tests/emulators/davis"
package = "mw-station"
test_target = "emulator_davis"
test_names = [
    "the_driver_keeps_reading_past_the_end_of_a_run_over_tcp",
    "the_driver_wakes_the_console_and_reads_it_over_a_serial_line",
    "a_flaky_console_costs_frames_and_not_the_station",
    "a_console_that_drops_the_connection_is_reconnected_to",
    "a_console_that_never_answers_ends_the_conversation_with_a_deadline",
]
note = """
**The strongest oracle in this programme**: 695 lines written years before any of it, with a
`-flaky` family of flags that exists to break a driver -- dropped bytes, corrupted bytes,
deliberately wrong CRCs, truncated packets, disconnections, hangs, slow responses and
ignored commands.

  the_driver_keeps_reading_past_the_end_of_a_run_over_tcp
      two runs of three packets, which means the driver RE-ISSUED `LOOP n` when the first
      run ended. That is the Davis defect by name: `GetLoopPackets` returns from its
      goroutine when `GetDavisLoopPackets` returns SUCCESSFULLY, so a console that delivers
      twenty good packets stops being read, permanently, with no error and no log line.
  the_driver_wakes_the_console_and_reads_it_over_a_serial_line
      the same thing over a real character device: `socat` bridges a pty to the emulator's
      port, so the wake handshake, the framing and the re-issue all happen over a tty. W3
      D-83's "socat pty pair", with the pinned oracle on the far end of it.
  a_flaky_console_costs_frames_and_not_the_station
      dropped bytes, corrupted bytes, bad CRCs and truncated packets at 20% each. The
      driver has to resynchronise on the next `LOO` header, drop what fails its checksum,
      and keep producing readings whose values are in range -- which is what says the
      resynchronisation found a real packet boundary rather than a plausible-looking offset.
  a_console_that_drops_the_connection_is_reconnected_to
      the other half of the flaky family: the connection is dropped mid-transmission at 30%
      and the console hangs at 10%. Each of those ends the CONVERSATION, and what has to be
      true is that the station keeps producing readings -- which is `Backoff` and a fresh
      `connect`, not a loop inside the driver.
  a_console_that_never_answers_ends_the_conversation_with_a_deadline
      `-no-response-rate 1.0`: the console ignores every command, including the wake. The
      driver returns a retryable failure naming the handshake rather than hanging, which the
      Go serial path does not -- `SetReadDeadline` is called only when a hostname is
      configured, so a serial console that stops talking hangs the read for ever."""

