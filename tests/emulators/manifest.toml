# Declared, not yet runnable. Each needs a driver this build does not have, and the gate
# prints them so the set is visible on every run rather than remembered — the same reason
# `cargo xtask gates` prints the deferred set.
#
# These are NOT skipped checks. There is nothing to check: `mw_station::plan` refuses a
# station of any of these types by name, so a configuration that needed one fails at
# startup rather than quietly collecting nothing.

[[pending]]
id = "snowgauge"
emulates = "The snow gauge — a gRPC server streaming `snowgauge.Reading`"
reference_path = ""
driver = "implementation-plan.md M6-1 (mw_grpc::snowgauge)"
note = """
The codec and the discard are done and tested (`mw_codec::SnowGaugeProto`, including DEV-9's
"a distance greater than the configured base distance is a fault"), and `mw_station::plan`
validates a `snowgauge` row and mints its component id. What is pending is the gRPC
**client** that dials the gauge and the emulator that answers it.

Both belong to `mw-grpc`: `ci/layers.toml` forbids `mw-station` from naming `tonic`, because
§1.4 gives the gRPC socket and every gRPC service to `mw-http` and `mw-grpc`. So this entry
stays pending and `crates/mw-station/src/snowgauge.rs` records the split -- a `snowgauge`
row is accepted by `plan()` and produces no component, which is a configured station that
collects nothing. **That is the one gap in M6-1 and it is named in the pull request rather
than left to be found here.**"""
