# The PR gate (DESIGN.md D-41). This workflow exists so the first implementation commit
# lands in a repository that can already tell it something is wrong.
#
# Required check: `gate`, and only `gate`. It depends on every other job, so the branch
# protection rule never has to be edited again when a job is added or renamed — adding the
# job to `needs:` below is the whole change.
#
# What runs where:
#
#   pull_request   everything. A PR is the only place a human is waiting on the answer.
#   push to main   everything. Nothing is written back to the repository from CI.
#   merge_group    everything, so a merge queue re-checks the combined result.
#
# Cross-compilation is deliberately not here — it is in platform.yml. Reasoning and the
# full required-checks set are in docs/release.md §1.

name: PR gate

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same PR; never cancel a run on main.
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # One place to bump the pinned toolchains. The stable pin must match
  # rust-toolchain.toml; the nightly pin exists only for ThreadSanitizer.
  RUST_STABLE: "1.96.0"
  RUST_NIGHTLY: "nightly-2026-10-01"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  build:
    name: cargo build --all-targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      # --locked throughout, so a PR that changes a dependency has to commit the lockfile
      # change — which is the only way a reviewer gets to see it.
      - run: cargo build --workspace --all-targets --all-features --locked

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  race:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ThreadSanitizer needs an unstable flag and an instrumented std, so this is the one
      # job that uses nightly. The pin is deliberate: an unpinned nightly turns a green PR
      # red on a commit that touched nothing.
      #
      # When a nightly regression breaks this job, bump the pin in the same PR. Do not
      # disable it — both data races DESIGN.md records (D-28, D-29) survived the life of
      # the Go project precisely because nothing looked.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsan
      # One exclusion, and it is a cfg rather than a narrowed command so that the set of
      # excluded targets is visible in the source and guarded below.
      # `crates/modernweather/tests/boot.rs` spawns the daemon as a CHILD process and
      # asserts on its exit status, its sockets and its sd-notify datagrams. A sanitizer
      # has nothing to say about that: its findings about the child are reported in the
      # child, `halt_on_error=1` kills the child on the first one, and the failure reaches
      # the test as a `ConnectionReset` or a timed-out `wait` instead of as a race report.
      # The in-process concurrency this job exists for is `mw-supervisor`'s, and
      # `crates/mw-supervisor/tests/concurrency.rs` is where TSan can see it.
      #
      # There is also a standing false positive on the one path only that binary takes:
      # `tokio` publishes a `ScheduledIo` to its I/O driver as an `epoll_ctl` token and
      # reads it back from `epoll_wait`, and TSan does not model those syscalls as
      # synchronisation, so it reports the allocating write against the driver thread's
      # atomic load. No `tokio` release fixes that: it needs
      # `__tsan_acquire`/`release` annotations wherever the pointer crosses the kernel. If a
      # suppression file is ever wanted instead, `race:tokio::runtime::io::` is the frame,
      # and the reproduction is `cargo test -p modernweather --test boot` with
      # `--cfg mw_sanitizer` removed.
      #
      # IT TAKES TWO THINGS TOGETHER, AND THAT IS A RULE FOR NEW TESTS RATHER THAN A NOTE.
      # The registration and the driver have to be two threads -- a **multi-threaded
      # runtime** -- and the thing registered has to be a **socket**, so that
      # `Handle::add_source` allocates the `ScheduledIo` on the registering thread. Either
      # alone is fine: `crates/mw-pipeline/tests/fanout.rs` runs four worker threads over
      # file I/O and is green, and every `current_thread` socket test is green.
      #
      # implementation-plan.md M3-1 hit it: its station-ingest test in
      # `crates/modernweather/src/boot.rs` was written
      # `#[tokio::test(flavor = "multi_thread")]` and binds a UDP socket, which made it the
      # first target in the workspace to combine the two -- and this job went red on
      # `Handle::add_source::<mio::net::udp::UdpSocket>`, exactly as described above. It is
      # `current_thread` now. **A test that needs a socket does not need worker threads**: a
      # `Serve` body and a test body interleave at every await on one thread. If a future
      # test genuinely needs both, the suppression frame above is the answer, not a narrowed
      # command -- and `crates/mw-station/tests/emulator.rs` is multi-threaded and binds
      # sockets but is `#[ignore]`d, so this job does not run it; un-ignoring it here would
      # need the same treatment.
      - name: cargo test under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread --cfg mw_sanitizer
          # RUSTDOCFLAGS has to carry the flag too, and this is not belt-and-braces: cargo
          # does not propagate RUSTFLAGS to rustdoc, so the doctest harness was compiled
          # WITHOUT the sanitizer while every dependency it links -- including the
          # build-std `std` -- was compiled with it. `-Zsanitizer` changes the ABI, so
          # rustc refuses: "mixing `-Zsanitizer` will cause an ABI mismatch in crate
          # mw_types", nineteen times, after the lib tests had already passed. It appeared
          # the moment M2-1 gave the workspace crates to compile; before that there was
          # nothing for rustdoc to run.
          #
          # The alternative fix is `--all-targets`, which excludes doctests. Rejected: it
          # drops a whole target class from the one job that observes real interleavings,
          # and this job's instruction is to fix it rather than narrow it.
          RUSTDOCFLAGS: -Zsanitizer=thread --cfg mw_sanitizer
          # A leak at process exit is not a race, and TSan's leak checker fires on
          # perfectly ordinary Box::leak of a static.
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 detect_leaks=0
          # Set explicitly, because rust-toolchain.toml otherwise wins and cargo runs on
          # stable, where -Z is rejected outright. Installing a nightly toolchain is not
          # the same as selecting it.
          RUSTUP_TOOLCHAIN: nightly-2026-10-01
        run: |
          cargo test --workspace --all-features --locked \
            -Z build-std --target x86_64-unknown-linux-gnu
      # The same guard the loom job has, for the same reason: an exclusion nobody has
      # counted is how a job stops running the thing it exists to run
      # (docs/reconciliation.md G-1). Adding a file to this list is a reviewable line.
      - name: Assert every sanitizer exclusion is declared
        if: always()
        run: |
          expected="crates/modernweather/tests/boot.rs"
          found=$(grep -rl "cfg(not(mw_sanitizer))" crates/ --include="*.rs" | sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::sanitizer exclusions changed"
            echo "expected: $expected"
            echo "found:    $found"
            exit 1
          fi
          echo "excluded from the sanitizer, as declared: $found"

  loom:
    name: loom interleavings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      # Exhaustive interleaving checks for lock-free code, on stable. loom and TSan are
      # complementary: loom is exhaustive over a model, TSan observes a real run.
      #
      # What this job runs, as of implementation-plan.md M2-3:
      # crates/mw-supervisor/tests/loom_publish.rs, a model of the published state table's
      # publish/read protocol. The two D-85 tests themselves -- config reload racing 64
      # readers, and shutdown with a stalled sink -- are `#![cfg(not(loom))]` and run in
      # the `race` job above, under ThreadSanitizer, which is where a test of the real
      # `ArcSwap` and a real multi-threaded runtime belongs.
      #
      # Scoped to two crates rather than --workspace, and it is not a preference. RUSTFLAGS
      # applies `--cfg loom` to EVERY crate in the graph, dependencies included, and
      # `tokio` gates its whole `net` module behind `#![cfg(not(loom))]` -- so under this
      # flag `tokio::net` ceases to exist and `hyper-util`, which uses
      # `tokio::net::UnixStream`, fails to compile. `hyper-util` arrives through `axum` and
      # `tonic`, so six of the eighteen crates can never build under `--cfg loom`. Nor can
      # that be fixed by a feature: cargo evaluates `[target.'cfg(loom)'.dependencies]`
      # against the target spec, not against RUSTFLAGS, so a dependency's own loom support
      # is unreachable this way.
      #
      # The two named here are the crates W3 D-85 puts lock-free code in -- the
      # supervisor's published snapshot and the pipeline's spool -- and neither depends on
      # axum or tonic. `mw-pipeline`'s model arrives with M3-2.
      - name: cargo test --cfg loom
        env:
          RUSTFLAGS: --cfg loom
          LOOM_PACKAGES: -p mw-supervisor -p mw-pipeline
          # `--cfg loom` substitutes the cell inside `mw-supervisor::publish`, so the
          # library links loom -- which a dev-dependency cannot do. The feature is
          # optional, off by default, and enabled by nothing else, so the daemon never
          # links loom. implementation-plan.md M2-3 added it; `publish.rs` fails the build
          # with a message if one of the two is set without the other.
          LOOM_FEATURES: --features mw-supervisor/loom
        run: |
          # shellcheck disable=SC2086  # deliberate word splitting: a cargo -p list
          cargo test $LOOM_PACKAGES $LOOM_FEATURES --locked
      # A scoped job can silently skip the thing it exists to run, which is
      # docs/reconciliation.md G-1. So a loom test written in a crate outside the scope is
      # a loud failure here rather than a test nobody runs.
      - name: Assert every loom test is inside the scope
        env:
          LOOM_PACKAGES: -p mw-supervisor -p mw-pipeline
        run: |
          scoped=$(echo "$LOOM_PACKAGES" | tr " " "\n" | grep -v "^-p$" | grep -v "^$")
          bad=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            crate=$(echo "$f" | cut -d/ -f2)
            if ! echo "$scoped" | grep -qx "$crate"; then
              echo "::error file=$f::$crate uses loom but the loom job does not build it"
              bad=1
            fi
          done <<EOF
          $(grep -rl "cfg(loom)" crates/ --include="*.rs" || true)
          EOF
          [ "$bad" -eq 0 ] || exit 1
          echo "every cfg(loom) user is inside: $(echo "$scoped" | tr "\n" " ")"

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # This job exists because of a mistake it would have caught: a GitHub expression
      # written with a double-quoted string literal is a parse error, and GitHub rejects
      # the *whole file* before running any job — so the gate reported nothing at all
      # rather than reporting a problem. A workflow that cannot fail visibly is the one
      # kind of CI bug this work item cannot afford.
      #
      # actionlint also runs shellcheck over every `run:` block, which is the only linting
      # the shell in these files would otherwise get.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint the workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Lint the standalone scripts
        run: |
          shellcheck -S warning \
            ci/spike/armv6-cross-spike.sh \
            ci/db/migrate-twice.sh \
            ci/db/rebuild-aggregates.sh \
            ci/db/offsite-backup.sh \
            ci/db/restore-rehearsal.sh \
            ci/db/migrate-from-go/migrate-from-go.sh \
            ci/db/migrate-from-go/extract-go-views.sh \
            ci/db/migrate-from-go/lab/run-in-pod.sh \
            ci/db/migrate-from-go/lab/emit-old-schema.sh \
            ci/db/migrate-from-go/lab/10-seed.sh \
            ci/conformance/go-target.sh

  gates:
    name: deferred gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      # Printed into every run's summary, so the set of not-yet-armed checks is visible on
      # each PR rather than remembered. See the header of ci/gates.toml.
      - name: Report gate state
        run: |
          {
            echo "## CI gates"
            echo
            cargo xtask gates --markdown
          } >> "$GITHUB_STEP_SUMMARY"
          cargo xtask gates

  layout:
    name: crate boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      # docs/service-architecture.md §1.4 says its three mechanisms "run in the existing
      # gate without a workflow change". Two of them do -- Cargo rejects a missing
      # dependency in `build`, and clippy.toml's disallowed-methods ride the `clippy` job --
      # but the third does not: the `gates` job PRINTS the deferred set, it does not RUN
      # anything, and no other job runs `cargo xtask gate layout`. A gate that `cargo xtask
      # gates` reports as ARMED while nothing executes it is docs/reconciliation.md G-1
      # exactly, so the job is here.
      #
      # No `| tee`: the exit code is the result. See the conformance job below for what
      # piping it costs.
      - run: cargo xtask gate layout

  codegen-drift:
    name: metric registry drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask gate codegen-drift
      # DESIGN.md R-2: the check regenerates into a temporary location and diffs. If it
      # wrote into the tree it would fix the problem it is checking for and always pass,
      # so this asserts that it did not.
      - name: Assert the check left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the drift check modified the working tree; it must only diff"
            git status --porcelain
            exit 1
          fi

  legacy-import-drift:
    name: migration SQL drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask gate legacy-import-drift
      # Same R-2 assertion as codegen-drift, for the same reason: a check that writes its
      # own fix into the tree always passes.
      - name: Assert the check left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the migration-SQL drift check modified the working tree"
            git status --porcelain
            exit 1
          fi

  conformance:
    name: frozen contract conformance (Rust target)
    runs-on: ubuntu-latest
    # Starts a daemon and a proxy and waits on them, the same as conformance-fixtures below.
    # A deadline turns a wedged daemon into a failed check rather than one that pends until
    # the job limit.
    timeout-minutes: 25
    services:
      timescaledb:
        # The same -ha image as the `database` job, for the same reason (DESIGN.md D-2). The
        # daemon asserts the server version at startup (D-62) and refuses to start against a
        # server that is too old, so a plain pg image here would fail this gate in a way that
        # looks nothing like its cause.
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # 127.0.0.1 rather than localhost: the service container publishes on IPv4 only, and
      # the URL in the configuration database is handed to sqlx rather than to psql.
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: mw_conformance
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: conformance
          # `cache-on-failure` defaults to false, and this job was DESIGNED TO FAIL until
          # M4-2 -- so without this line nothing was ever saved under the key above, nothing
          # was ever restored, and every PR cold-built the root workspace, the daemon and
          # contract/conformance. M4-2 turned it green, and the line stays: this is still the
          # most expensive job in the file, and a red run is exactly when the next push wants
          # a warm cache.
          cache-on-failure: true
          # Two workspaces, for the same reason conformance-fixtures names two: the root one
          # builds xtask and the daemon, and contract/conformance is standalone on purpose
          # (W1 Decision 7).
          workspaces: |
            .
            contract/conformance
      # psql reaches the weather schema and sqlite3 reads the configuration database's
      # migration ledger; the runner image ships both, so this is one apt call rather than a
      # failure part-way through a run. The client may be a major version behind the server,
      # which is fine for psql -- nothing here runs pg_dump.
      - name: Ensure psql and sqlite3 are present
        run: |
          missing=""
          command -v psql    >/dev/null || missing="$missing postgresql-client"
          command -v sqlite3 >/dev/null || missing="$missing sqlite3"
          if [ -n "$missing" ]; then
            sudo apt-get update
            # shellcheck disable=SC2086  # deliberate word splitting: $missing is a package list
            sudo apt-get install -y --no-install-recommends $missing
          fi
          psql --version
          sqlite3 --version
      # THIS JOB IS GREEN AS OF implementation-plan.md M4-2, AND IT IS A REQUIRED CHECK.
      #
      # `cargo xtask conformance` builds the daemon, stands it up against a freshly migrated
      # TimescaleDB, seeds both databases from `ci/conformance/rust-seed/`, and replays all
      # 70 frozen fixtures at it -- then, only if that replay is accepted, runs W1
      # Decision 10's negative control through `contract/tools/rig/mangle_proxy.py` and
      # requires it to break at least twenty of the responses the target serves.
      #
      # It was red by design from M2 until M4-2, which is what M2-5 armed it for: a gate that
      # is honest from Milestone 2 onward rather than discovered in Milestone 4
      # (docs/reconciliation.md G-1). M4-2 turned it green and put it back in the `gate`
      # job's `needs`.
      #
      # `set -o pipefail` is what makes the verdict visible. The default shell is `bash -e`
      # WITHOUT it, so the exit status of `gate | tee` was tee's -- always zero -- and this
      # job was structurally incapable of reporting a conformance failure: G-1 in the job
      # that exists to avoid it. `coverage-ratchet` had the identical pipe and was fixed the
      # same way in c1b645f.
      #
      # **Two exit codes, and the distinction is load-bearing.** 1 is "the replay reached a
      # verdict and the binary does not conform"; 2 is "the run reached no verdict" -- a
      # missing tool, a busy port, a database that would not answer, a fixture count that is
      # not 70, a deviation no fixture declares, a seed that inserted nothing, or a negative
      # control that did not hold. ci/gates.toml declares both.
      - name: Replay the fixtures against the Rust binary
        run: |
          set -o pipefail
          # `2>&1` as well as the pipe: the counts are printed on stdout but the verdict and
          # the gate's on_exit message go to stderr, and the verdict is the one paragraph
          # that explains why this check is red. Without it the step summary below shows
          # "0 passed, 70 failed" and nothing that says that is the correct state.
          cargo xtask gate conformance 2>&1 | tee /tmp/conformance.txt
      - name: Report
        if: always()
        run: |
          {
            echo "## Frozen contract conformance (Rust target)"
            echo
            echo "### The gate's verdict"
            echo '```'
            cat /tmp/conformance.txt 2>/dev/null || echo "the gate did not run"
            echo '```'
            echo "### The replay"
            echo '```'
            tail -n 3 target/conformance-rust/direct.txt 2>/dev/null \
              || echo "the replay did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the replay output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-rust-output
          path: |
            target/conformance-rust/direct.txt
            target/conformance-rust/mangled.txt
            target/conformance-rust/logs/
          if-no-files-found: ignore

  conformance-fixtures:
    name: frozen contract fixtures vs the Go daemon
    runs-on: ubuntu-latest
    # The only job that starts long-lived subprocesses and waits on them. A deadline turns a
    # wedged daemon into a failed check rather than a check that pends until the job limit.
    timeout-minutes: 25
    services:
      timescaledb:
        # The same -ha image as the `database` job, for the same reason (DESIGN.md D-2): the
        # daemon's startup provisioning uses timescaledb_toolkit, which the plain image has not
        # got, so it would fail before serving a single fixture.
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # 127.0.0.1 rather than localhost: the service container publishes on IPv4 only, and the
      # Go daemon's connection string is handed to lib/pq rather than to psql.
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: conformance
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      # The Go daemon, at the commit the fixtures were captured from.
      #
      # go-target.sh can fetch this itself and does so when run by hand, but not here: an
      # unauthenticated git fetch from an Actions runner is not dependable. This job's first run
      # fetched c3ec9f7 by SHA; its second was refused with "upload-pack: not our ref" and its
      # third could not even see refs/heads/master — same public repository, same commit, no
      # change in between. actions/checkout uses the job's token, which is the supported path.
      # The script still verifies that what it was handed is the pinned commit.
      - name: Check out the Go daemon at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: chrissnell/remoteweather
          ref: c3ec9f7d7dec2c5f71a1f48b8af2b9b0921b7bcf
          path: .conformance-go-src
          fetch-depth: 0
      # The Go daemon is the target, so this job needs a Go toolchain as well as a Rust one.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: conformance-fixtures
          # Two workspaces: the root one for xtask, which runs the gate, and
          # contract/conformance, which is standalone on purpose (W1 Decision 7) so the runner
          # stays buildable against the Go binary with no Rust daemon in the tree.
          workspaces: |
            .
            contract/conformance
      # The runner image ships both. The harness reaches the hypertable only through psql and
      # writes the daemon's configuration only through sqlite3, so an image change that dropped
      # either is worth one apt call rather than a confusing failure part-way through a run.
      # Note the psql client may be a major version behind the server; that is fine for psql,
      # unlike pg_dump, which is why the `database` job installs a 17 client and this one does not.
      # Outside target/ on purpose. Swatinem/rust-cache restores target/ wholesale, so a
      # WORKDIR underneath it arrives pre-populated with the previous run's Go checkout and
      # binaries — which is what made this job's second run fail where its first had passed.
      # It goes through GITHUB_ENV rather than the job's `env:` because the runner context is
      # not available there.
      - name: Point the harness at the checkout, and keep its workdir out of the cache
        run: |
          echo "RW_REPO=$GITHUB_WORKSPACE/.conformance-go-src" >> "$GITHUB_ENV"
          echo "WORKDIR=$RUNNER_TEMP/conformance-go" >> "$GITHUB_ENV"
      - name: Ensure psql and sqlite3 are present
        run: |
          missing=""
          command -v psql    >/dev/null || missing="$missing postgresql-client"
          command -v sqlite3 >/dev/null || missing="$missing sqlite3"
          if [ -n "$missing" ]; then
            sudo apt-get update
            # shellcheck disable=SC2086  # deliberate word splitting: $missing is a package list
            sudo apt-get install -y --no-install-recommends $missing
          fi
          psql --version
          sqlite3 --version
      # Both halves of W1 Decision 10 happen inside the gate: the fixtures are replayed against
      # the daemon and must all pass, and then replayed through contract/tools/rig/mangle_proxy.py
      # and must fail. A green run without the negative control is not accepted.
      - name: Replay the fixtures against the Go daemon
        run: cargo xtask gate conformance-fixtures
      - name: Report
        if: always()
        run: |
          {
            echo "## Conformance fixtures (Go target)"
            echo
            echo '```'
            tail -n 3 "$WORKDIR/direct.txt" 2>/dev/null || echo "the accepted replay did not run"
            echo '```'
            echo '```'
            tail -n 3 "$WORKDIR/mangled.txt" 2>/dev/null || echo "the negative control did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the replay output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-fixtures-output
          path: |
            ${{ runner.temp }}/conformance-go/direct.txt
            ${{ runner.temp }}/conformance-go/mangled.txt
            ${{ runner.temp }}/conformance-go/logs/
          if-no-files-found: ignore

  driver-emulators:
    name: Go emulators against Rust drivers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      # The emulators stay in Go deliberately (DESIGN.md D-40): an independently written
      # emulator is a stronger oracle than one written alongside the driver. So this job
      # needs a Go toolchain. `cargo xtask emulator-tests` runs every emulator
      # tests/emulators/manifest.toml declares and fails unless every test it names passed.
      #
      # It checks nothing out of the reference repository YET. The manifest pins the commit
      # the first `origin = "reference"` entry will use, and the one emulator that runs
      # today lives in this repository because the reference tree has none for WeatherLink
      # Live — which the manifest records in full, and which is docs/reconciliation.md's
      # O-13 for the owner.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@v2
      # The emulators the reference tree does not have are written here, in Go, and
      # tests/emulators/manifest.toml records which ones and why. Nothing else in this
      # workflow lints Go, so an unformatted or suspect emulator would land unseen -- and
      # an emulator is the oracle, so it is the last thing that should be sloppy.
      - name: Lint the emulators this repository owns
        run: |
          for module in tests/emulators/*/go.mod; do
            dir="$(dirname "$module")"
            echo "::group::$dir"
            unformatted="$(gofmt -l "$dir")"
            if [ -n "$unformatted" ]; then
              echo "::error file=$dir/main.go::gofmt would change: $unformatted"
              echo "::endgroup::"
              exit 1
            fi
            (cd "$dir" && go vet ./...)
            echo "::endgroup::"
          done
      - run: cargo xtask gate driver-emulators

  serial-bridge:
    name: a ser2net fan-out broadcasts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      # `ser2net` is the thing under test, not a test dependency that could be stubbed:
      # GRA-787 exists because `max-connections` is documented to broadcast and the
      # programme needed that measured rather than read. A hand-written fan-out would prove
      # only that its author can write one. `socat` provides the pty pair that stands in for
      # the station, so the whole proof runs with no hardware.
      #
      # The runner also reports the version it measured. Debian/Ubuntu and the Arch package
      # pitcairn installs from are not the same release, and both were checked by hand (4.6.4
      # and 4.6.8) -- so a future divergence should be visible in the log rather than assumed
      # away.
      - name: Install the bridge under test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ser2net socat
      - run: cargo xtask gate serial-bridge

  database:
    name: migrations and server version
    runs-on: ubuntu-latest
    services:
      timescaledb:
        # The -ha image: DESIGN.md D-2 requires TimescaleDB 2.31 with timescaledb_toolkit,
        # and the plain timescale/timescaledb image has no toolkit. CI running a different
        # server than the design specifies is not a detail — three of the six load-bearing
        # spike answers are version-gated.
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # migrate-twice.sh reconstructs the previous release's schema from git, so it
          # needs tags and history rather than a shallow clone.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      # The runner images ship postgresql-client 16, and pg_dump refuses to dump from a
      # newer server than itself. Without this the comparison fails with a version error
      # that looks nothing like its cause.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # Installing the package is not enough. /usr/bin/pg_dump is a postgresql-common
          # wrapper, and it resolves the version from the local cluster list rather than
          # from the server it is about to talk to — the runner has a stopped PostgreSQL 16
          # cluster, so the wrapper picked 16 and pg_dump refused the 17 service with
          # "aborting because of server version mismatch". Put the versioned bin directory
          # first so every later step gets the 17 binaries.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/psql --version
          /usr/lib/postgresql/17/bin/pg_dump --version
      # The gate covers two databases: the weather schema on this service container and the
      # configuration schema on SQLite (D-8 as amended by A-W6-2). The runner image ships
      # sqlite3, so this is one apt call rather than a failure part-way through the run.
      - name: Ensure sqlite3 is present, and new enough
        run: |
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends sqlite3
          fi
          sqlite3 --version
          # migrations/config/ needs STRICT (3.37) and unixepoch() (3.38). ubuntu-latest
          # ships 3.45, but ubuntu-22.04 ships 3.37.2 — so on a runner-image change the
          # floor should fail here, naming itself, rather than inside a migration. The
          # daemon is unaffected either way: libsqlite3-sys is bundled.
          if ! sqlite3 ':memory:' 'CREATE TABLE t (a INT) STRICT; SELECT unixepoch();' >/dev/null
          then
            v="$(sqlite3 --version | cut -d' ' -f1)"
            echo "::error::sqlite3 $v is below the 3.38 floor migrations/config/ needs (STRICT, unixepoch())"
            exit 1
          fi
      - name: Assert the server version (D-42)
        run: psql --set ON_ERROR_STOP=1 "$DATABASE_URL" -f ci/sql/assert-timescaledb-version.sql
      - name: Apply the migrations twice and compare
        run: cargo xtask gate db-migrate-twice

  db-restore-rehearsal:
    name: off-site backup restored and reconciled
    runs-on: ubuntu-latest
    services:
      timescaledb:
        # The same image and the same reasoning as the `database` job: DESIGN.md D-2
        # requires TimescaleDB 2.31 with timescaledb_toolkit.
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      # The same PostgreSQL 17 client the `database` job needs, and for the same reason: the
      # runner images ship 16, pg_dump refuses a newer server than itself, and /usr/bin/pg_dump
      # is a postgresql-common wrapper that resolves its version from the local cluster list
      # rather than from the server.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_restore --version
      # rclone is the archive's only transport, in CI as in the cluster -- the default mode
      # writes to a LOCAL rclone remote, which needs the binary and no configuration at all.
      # Pinned rather than `apt install rclone`, because the runner image's version is not
      # something this gate should silently inherit.
      - name: Install rclone
        env:
          RCLONE_VERSION: "1.68.2"
        run: |
          curl -fsSL -o /tmp/rclone.zip \
            "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          unzip -q -j /tmp/rclone.zip "*/rclone" -d /tmp/rclone-bin
          sudo install -m 0755 /tmp/rclone-bin/rclone /usr/local/bin/rclone
          rclone version | head -1
      # Default mode: seed, dump through a local rclone remote, restore into a second
      # database, reconcile byte for byte, re-measure A-W9-2 and assert the four /span bands
      # after phase 1 only. No credential, so this runs on every PR including from a fork.
      # The R2 half is `--from-archive`, run by a monthly CronJob beside the cluster.
      - name: Restore the archive and reconcile it
        run: cargo xtask gate db-restore-rehearsal

  db-tests:
    name: database tests (real TimescaleDB)
    runs-on: ubuntu-latest
    services:
      timescaledb:
        # The same image and the same reasoning as the `database` job: DESIGN.md D-2
        # requires TimescaleDB 2.31 with timescaledb_toolkit, and the plain
        # timescale/timescaledb image has no toolkit.
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # `cargo xtask db-tests` builds the connection string from these. PGDATABASE is the
      # database the image creates, and nothing here drops it — the tests apply
      # migrations/ through sqlx's own migrator and delete only their own station rows.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      # No psql: this gate needs no client of its own, which is the one difference from the
      # `database` and `conformance` jobs and the reason this job has no apt step.
      - name: Run the tests that need a database
        run: cargo xtask gate db-tests

  coverage:
    name: coverage ratchet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # A ratchet, not a threshold: the prompt for this work item is explicit that a fixed
      # target invites tests written to hit a number. See xtask/src/coverage.rs.
      #
      # The floor is raised by hand, in the PR that earns it, with
      # `cargo xtask coverage --bump`. CI does not commit to the repository — partly
      # because docs/release.md §5 keeps write credentials out of CI, and partly because a
      # floor that moves on its own is not a reviewed decision.
      - name: Check the ratchet
        # `set -o pipefail` because the default shell is `bash -e` without it, so the exit
        # status of `gate | tee` is tee's -- always zero. Until this line the ratchet could
        # not fail: a coverage drop printed its diagnosis into the summary and the job went
        # green, which is docs/reconciliation.md G-1 in the job that guards against
        # regression. Demonstrated rather than reasoned about: under `bash -e`,
        # `( exit 2 ) | tee` exits 0, and with pipefail it exits 2.
        #
        # Safe to turn on here, and this is the whole reason this is separable from the
        # identical pipe in the `conformance` job above: the ratchet exits 0 today --
        # verified by running it. The conformance gate exits 2 by design until M4-2, so an
        # honest status there blocks every merge, which is a decision this does not take.
        #
        # The floor itself lives in ci/coverage-floor.txt and is not quoted here: a figure
        # in a comment goes stale the first time the floor moves, and this one had (it said
        # "83.54% against a 75.00 floor" long after both numbers changed).
        run: |
          set -o pipefail
          cargo xtask gate coverage-ratchet | tee /tmp/coverage.txt
      - name: Report
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            echo '```'
            cat /tmp/coverage.txt 2>/dev/null || echo "not measured"
            echo '```'
            echo "Raise the floor with \`cargo xtask coverage --bump\` and commit"
            echo "ci/coverage-floor.txt in the same PR."
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: gate
    # The single required check. Everything below is a dependency, so branch protection
    # needs exactly one entry and never changes.
    #
    # `conformance` is back in this list, which is implementation-plan.md M4-2's own
    # done-criterion.
    # ---------------------------------------------------------------------------------
    # It was taken out by M2-5 and the reason was sound: that job replays the frozen
    # contract against the Rust binary, and from M2 until M4-2 it was RED BY DESIGN -- all
    # 70 fixtures failed on the status line because no legacy endpoint existed. A check that
    # is red by design cannot be a required check; inside this list it would have blocked
    # every merge for two milestones while saying nothing new on any of them, and a required
    # check everybody overrides stops being read at all -- which lands where
    # docs/reconciliation.md G-1 did, by a different route.
    #
    # M4-2 implemented `mw-api-legacy`, so the gate is green and the line goes back in the
    # same PR, which is what both that item's text and ci/gates.toml said would happen. What
    # "green" means is the gate's policy and not "70 fixtures passed": 42 frozen-class and
    # six coupled-class fixtures must pass, the nine `retired` ones (D-69) never gate, and
    # the thirteen website fixtures M4-3 owns are excused by a list declared in
    # xtask/src/conformance.rs and checked in both directions. See that file.
    needs:
      - fmt
      - clippy
      - build
      - test
      - workflows
      - race
      - loom
      - gates
      - layout
      - codegen-drift
      - legacy-import-drift
      - conformance
      - conformance-fixtures
      - driver-emulators
      - database
      - db-tests
      - db-restore-rehearsal
      - coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A skipped or cancelled dependency is not a pass. `needs.*.result` is checked
      # explicitly because `if: always()` would otherwise let this job succeed while a
      # dependency failed.
      - name: Verify every job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "dependency results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a gate job did not succeed ($r)"
              exit 1
            fi
          done
          echo "gate green"
