<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>RemoteWeather</title>
    <script>
      // chonky honours the OS preference before JS runs, which means before this
      // document paints: a stored choice wins, the OS preference is the fallback.
      // Inline and synchronous on purpose -- a module script would paint light first
      // and then flip, which is the flash this exists to avoid.
      (function () {
        try {
          var stored = localStorage.getItem('chonky-theme');
          var dark = stored ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
