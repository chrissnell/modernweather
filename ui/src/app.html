<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>RemoteWeather</title>
    <script>
      // An explicit choice, and **nothing at all otherwise**.
      //
      // chonky's `tokens.css` already tracks the device with no JavaScript:
      // `:root` is light, `[data-theme="dark"]` is dark, and
      // `@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) }` is the
      // device. Writing an attribute here when the operator has not chosen one would
      // **pin** the answer and stop that media query ever applying again -- which is how
      // the first version of this shipped a UI that was dark on a light laptop and had no
      // way back.
      //
      // So the attribute is written only for a stored choice. `theme` is chonky's own key
      // and not one of ours: its `ThemeToggle` reads and writes that key, and a second key
      // meant the toggle's choice was invisible to this script on the next load.
      //
      // Inline and synchronous on purpose -- a module script would paint one theme and
      // then flip, which is the flash this exists to avoid.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          // Storage denied. Leave the attribute off and let the device decide, which is
          // the better failure than defaulting everyone to one theme.
        }
      })();
    </script>
    <script>
      // `crypto.randomUUID` is **secure-context only**, and this UI is reached over plain
      // HTTP at a LAN address -- so on the real deployment the function is simply absent.
      // The first thing to call it is chonky's `toast`, which a save raises *after* its
      // POST has already committed, so the operator saw
      // `TypeError: crypto.randomUUID is not a function` and read it as a save that failed
      // when the save had landed (GRA-803).
      //
      // `crypto.getRandomValues` carries no such gate, so the same version-4 value is
      // available by a route that exists here. Inline rather than a module so it is in
      // place before anything that might call it is imported, and after the theme script
      // because that one has to be first for the paint.
      (function () {
        try {
          var c = window.crypto;
          if (
            !c ||
            typeof c.randomUUID === 'function' ||
            typeof c.getRandomValues !== 'function'
          ) {
            return;
          }
          var uuid = function () {
            var b = new Uint8Array(16);
            c.getRandomValues(b);
            b[6] = (b[6] & 0x0f) | 0x40; // version 4
            b[8] = (b[8] & 0x3f) | 0x80; // variant 1
            var s = '';
            for (var i = 0; i < 16; i++) {
              s += (b[i] + 0x100).toString(16).slice(1);
              if (i === 3 || i === 5 || i === 7 || i === 9) {
                s += '-';
              }
            }
            return s;
          };
          try {
            c.randomUUID = uuid;
          } catch (e) {
            // Assignment refused; the prototype below is the other way in.
          }
          if (typeof c.randomUUID !== 'function') {
            Object.defineProperty(Object.getPrototypeOf(c), 'randomUUID', {
              value: uuid,
              writable: true,
              configurable: true
            });
          }
        } catch (e) {
          // A browser with no `getRandomValues` at all is older than this UI supports;
          // leaving the absence in place is better than a predictable identifier.
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
