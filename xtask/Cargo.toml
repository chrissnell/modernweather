[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Repository tasks: the metric-registry code generator, the CI gates and the release pipeline"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# The `driver-emulators` gate verifies that each vendored reference emulator is still the
# copy `tests/emulators/manifest.toml` recorded. D-32 governs the DAEMON's dependencies and
# "test infrastructure is out of its scope" (**A-4**), which is what this crate is.
sha2 = "0.10"
