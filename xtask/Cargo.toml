[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Repository tasks: the metric-registry code generator, the CI gates and the release pipeline"

[lints]
workspace = true

[dependencies]
# `mgmt-schema` serialises the management OpenAPI document, and `utoipa` is a set of DERIVE
# macros -- the schema exists only as the output of compiling the handlers. So the emitter
# links the crate it describes, which is also what makes the bytes it writes and the routes
# they describe one compilation. `xtask` is `exempt_members` in ci/layers.toml, so this
# dependency is outside the layer order by declaration rather than by accident.
mw-api-mgmt = { path = "../crates/mw-api-mgmt" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# The `driver-emulators` gate verifies that each vendored reference emulator is still the
# copy `tests/emulators/manifest.toml` recorded. D-32 governs the DAEMON's dependencies and
# "test infrastructure is out of its scope" (**A-4**), which is what this crate is.
sha2 = "0.10"
# `gate-ui-bundle` measures the bundle **gzipped**, because that is what a browser
# downloads and therefore what W5 §6.5's numbers mean. Done in-process rather than by
# shelling out to `gzip`, so the gate needs nothing on PATH and two runs of the same tree
# produce the same number.
flate2 = "1"
