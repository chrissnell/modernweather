#Type Name           ID  GECOS                           Home directory          Shell
u     modernweather  -   "ModernWeather service user"    /var/lib/modernweather  /usr/sbin/nologin
# dialout/uucp for serial station hardware; the group name differs by distribution, and a
# membership line for a group that does not exist is ignored rather than fatal.
m     modernweather  dialout
m     modernweather  uucp
