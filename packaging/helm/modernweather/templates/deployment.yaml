{{- /*
One replica, and that is not a value.

Two daemons would hold the same SQLite configuration database over a ReadWriteOnce volume,
which is not a thing SQLite or the volume allows; and the collector half assumes one node
owns a station. Scaling out is a peers/uplink configuration, not a `replicas` field, so
there is deliberately no `replicaCount` value to set wrongly.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modernweather.fullname" . }}
  labels:
    {{- include "modernweather.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: {{ .Values.updateStrategy }}
  selector:
    matchLabels:
      {{- include "modernweather.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "modernweather.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "modernweather.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- /*
      NO init container, and this is the one thing in the chart that is a correction
      rather than a translation. The hand-applied Deployment ran `apk add sqlite` in an
      Alpine init container to write a configuration row into config.db; the namespace
      enforces `restricted` Pod Security, so `apk` ran as non-root against a read-only
      package store and the pod crash-looped 392 times. Nothing here installs anything at
      pod start: the daemon creates config.db itself and applies its own migrations, and
      the rows a human would have seeded are entered through the management UI.
      */}}
      containers:
        - name: modernweather
          image: {{ include "modernweather.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /*
          The image's ENTRYPOINT is the binary and its CMD is `--config
          /var/lib/modernweather/config.db`. `args` replaces the CMD and leaves the
          ENTRYPOINT alone, so the flags are stated once, here, and `configPath` cannot
          disagree with the volume mount below.
          */}}
          args:
            - --config
            - {{ .Values.configPath | quote }}
            - --log-level
            - {{ .Values.logLevel | quote }}
            - --log-format
            - {{ .Values.logFormat | quote }}
            {{- with .Values.setupListen }}
            - --setup-listen
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.containerPorts.management }}
              protocol: TCP
            {{- if .Values.service.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.containerPorts.grpc }}
              protocol: TCP
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ dir .Values.configPath }}
            {{- /*
            The image is FROM scratch, so there is no /tmp in it at all, and
            readOnlyRootFilesystem would not give it one. SQLite spills temporary B-trees
            and journals there for operations that exceed its cache -- a configuration
            database is small, but "small" is not a guarantee and the failure would be a
            write error during a save. An emptyDir is 20 bytes of manifest.
            */}}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "modernweather.pvcName" . }}
          {{- else }}
          {{- /*
          No volume means config.db is recreated on every restart: the instance loses its
          administrator account, its stations and its spool. For a throwaway render only.
          */}}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
