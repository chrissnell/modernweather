# The database. Read charts/timescaledb/Chart.yaml first — it says why these are the
# values they are, and most of them should not be changed without reading
# docs/reconciliation.md §7.
enabled: true

# Empty means `<release>-db`, which is what the hand-applied StatefulSet is called. That
# matters more than it looks: a StatefulSet's volumeClaimTemplate produces
# `data-<name>-0`, so the name is what decides whether this chart adopts the existing
# 350 GiB of observations or provisions an empty volume beside them.
fullnameOverride: ""

image:
  # NOT the plain `timescale/timescaledb` image: the `-ha` one carries
  # `timescaledb_toolkit`, which D-2 requires.
  repository: timescale/timescaledb-ha
  tag: pg17
  pullPolicy: IfNotPresent

imagePullSecrets: []

auth:
  database: modernweather
  username: postgres
  # REQUIRED. The chart does not generate a password, and that is deliberate: a generated
  # superuser password would rotate on `helm upgrade` unless the chart read back its own
  # previous Secret, and a database holding a decade of irreplaceable observations is the
  # wrong place to find out that it did. Create the Secret once, out of band.
  existingSecret: ""
  secretKey: password
  # `scram-sha-256` rather than the image default. `md5` is what an old client expects and
  # this deployment has exactly one client.
  hostAuthMethod: scram-sha-256
  # Checksums cost a few percent of write throughput and are the only thing that detects
  # a `local` volume going bad underneath a single replica.
  initdbArgs: --data-checksums

persistence:
  # Where PGDATA lives inside the mount. The image's entrypoint refuses a PGDATA that is
  # the mount point itself when the volume has a `lost+found`.
  mountPath: /var/lib/postgresql
  pgData: /var/lib/postgresql/pgdata
  size: 350Gi
  storageClass: modernweather-db-local
  accessModes:
    - ReadWriteOnce

  # The `local` volume, and the two cluster-scoped objects it needs.
  #
  # Both are created with `helm.sh/resource-policy: keep`, so neither a failed upgrade nor
  # an uninstall can take the PersistentVolume -- and therefore the data -- with it. Set
  # either to false when the objects already exist and are not to be adopted.
  local:
    enabled: true
    createStorageClass: true
    createPersistentVolume: true
    # The host path on `node`. A Talos user volume, mounted under /var/mnt.
    path: ""
    # REQUIRED when local.enabled. The one machine this volume — and therefore this
    # database — can run on.
    node: ""
    # Empty means `<fullname>-<node>`, matching what was applied by hand.
    persistentVolumeName: ""

service:
  port: 5432
  # A second, non-headless Service called `<fullname>-rw`.
  #
  # Its name is the point: the daemon's weather-database URL names a writable endpoint, and
  # spelling that `-rw` means a later move to a replicated setup changes what the name
  # resolves to rather than every URL that uses it. A headless Service is the wrong thing
  # for a connection pool to dial — it answers with pod IPs, which change.
  readWriteAlias: true
  annotations: {}

# Sized from the measured workload (docs/reconciliation.md §7.4): the heaviest operation
# is a single-session aggregate refresh, so single-thread speed matters and core count does
# not. The memory limit is the node's, less headroom; the request is `shared_buffers` plus
# the hot uncompressed chunks.
resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    memory: 24Gi

# No CPU limit, deliberately: a throttled aggregate refresh misses its deadline, and the
# node is tainted so there is nothing to protect it from.

# The node is tainted so that nothing else lands on it (§7.4). Both halves are needed —
# the toleration to be allowed on, the selector to be sent there.
nodeSelector:
  workload-class: database
tolerations:
  - key: workload-class
    operator: Equal
    value: database
    effect: NoSchedule
affinity: {}
priorityClassName: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # NOT true. The image's entrypoint writes postgresql.conf and the socket directory into
  # paths that are not the data volume; /var/run/postgresql and /tmp are emptyDirs for
  # that reason, but the entrypoint also touches its own /etc.
  readOnlyRootFilesystem: false

# Five minutes, because a shutdown that is cut short is a crash: PostgreSQL would come back
# replaying WAL, and on a hypertable mid-compression that is a long replay.
terminationGracePeriodSeconds: 300

# `pg_isready` against the real database rather than a TCP check, so a server that is up
# but still replaying WAL reads as not ready.
startupProbe:
  periodSeconds: 5
  failureThreshold: 60
readinessProbe:
  periodSeconds: 10
  failureThreshold: 3
livenessProbe:
  periodSeconds: 30
  failureThreshold: 6

# Extra environment for the postgres container, in the Kubernetes `env` shape. The
# server's own tuning (`shared_buffers`, `synchronous_commit`, `max_worker_processes`)
# goes here as the image's `POSTGRES_INITDB_ARGS`/`PGOPTIONS` or in a mounted
# postgresql.conf, not as chart values: §7 does not fix those numbers, and inventing
# defaults for them in a chart would freeze a guess.
extraEnv: []

# -- Off-site backups to Cloudflare R2 ---------------------------------------------------
#
# ON BY DEFAULT, and that is the point. docs/reconciliation.md §7.5 makes off-site backups
# "the condition that makes a single replica safe" -- the owner's condition for accepting a
# database that cannot reschedule. A chart that shipped that database with backups off by
# default would ship the configuration the owner declined. Turning them OFF is the explicit
# act; `backup.enabled: false` is how.
#
# The mechanism is `ci/db/offsite-backup.sh`, which this chart mounts rather than copies:
# `files/offsite-backup.sh` is a symlink to it, and Helm inlines the content when packaging.
# D-6's decision stands -- `pg_dump` of the raw hypertable plus an aggregate refresh on
# restore, and no bespoke tool.
backup:
  enabled: true

  # The bucket, and the credential that can write to it. Both REQUIRED when enabled; the
  # chart refuses to render without them rather than installing a CronJob that fails at
  # 04:00 on Sunday.
  bucket: ""
  # Everything is written under <bucket>/<prefix>/.
  prefix: db
  # The rclone remote's name. It appears only inside the job, in MW_BACKUP_REMOTE and in
  # the RCLONE_CONFIG_<NAME>_* variables.
  remoteName: r2
  credentials:
    existingSecret: ""
    accessKeyIdKey: accessKeyId
    secretAccessKeyKey: secretAccessKey
    # The account-specific endpoint, in the Secret rather than in values: it contains the
    # Cloudflare account id.
    endpointKey: endpoint
  # R2 is addressed as S3. `Cloudflare` selects rclone's R2-specific behaviour and `auto`
  # is the only region R2 has.
  provider: Cloudflare
  region: auto

  # Weekly, per the owner's constraint (§7.5). Sunday 04:00 UTC.
  schedule: "0 4 * * 0"
  timeZone: Etc/UTC

  # `latest.json` is never pruned; this bounds only the timestamped manifests beside it.
  manifestRetentionDays: 90

  # The daemon's config.db is on the DAEMON's volume, which this job does not mount, so
  # there is nothing here for it to dump. §7.5 does count config.db as irreplaceable -- it
  # is backed up where it lives.
  allowNoConfigDb: true

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  # rclone is copied out of its own image by an init container, because the backup has to
  # run in the TimescaleDB image to get the matching `pg_dump` and that image has no
  # rclone. Pinned: an unpinned `latest` would change the thing that writes the archive
  # without anybody choosing to.
  rcloneImage: rclone/rclone:1.68.2
  rcloneResources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 512Mi

  # Left unbounded on purpose. `offsite-backup.sh` streams everything --
  # `psql COPY ... TO STDOUT | gzip | rclone rcat` -- so /tmp holds only the progress
  # meter and the manifest, a few kilobytes. The rehearsal below is the one that needs a
  # cap, because it downloads.
  tmpSizeLimit: ""

  nodeSelector: {}
  tolerations: []
  extraEnv: []

  # The monthly restore rehearsal. A backup nobody has restored is a hypothesis.
  rehearsal:
    enabled: true
    schedule: "0 5 1 * *"
    timeZone: Etc/UTC
    # Restored into a database of its own on the same server, which is what makes it cheap
    # enough to run monthly. `restore-rehearsal.sh` DROPS and recreates this, so it must
    # not name anything else.
    database: mw_restore_rehearsal
    # Fetched at run time, from the branch rather than a pinned commit. The rehearsal asks
    # whether TODAY's restore path can read the archive you have; a pinned script freezes
    # that question. cronjob-restore-rehearsal.yaml has the full argument.
    sourceRepo: chrissnell/modernweather
    # A branch name, a tag or a commit sha -- it is passed to codeload verbatim.
    sourceRef: main
    # Which raw years to restore. `current` is the current calendar year; `all` restores
    # every year in the archive; anything else is passed through as a space-separated list
    # of years.
    #
    # NOT `all` by default, and this is a safety bound rather than a speed one. The
    # rehearsal restores into a second database on the SAME server, which here means the
    # same single `local` volume production is on -- and a restore is uncompressed, ~19 GB
    # a year against ~3.6 GB in the archive (§7.5). A decade of it can exhaust the volume
    # underneath a database that cannot reschedule (§7.4), and ENOSPC there is a worse
    # outcome than never rehearsing. One year still exercises every part of the restore
    # path except whether the older objects are readable; that is worth a run by hand, with
    # somewhere to put it.
    years: current
    activeDeadlineSeconds: 7200
    # BOUNDED, unlike the backup's. The rehearsal downloads the archive and restores it,
    # so /tmp is real data -- and this emptyDir is on the node's root filesystem, which on
    # a single-node database is the same machine the database is on. An unbounded one
    # would make a failed rehearsal able to fill the disk under the live server.
    tmpSizeLimit: 1Gi
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "4"
        memory: 4Gi
