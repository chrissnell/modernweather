# ModernWeather metric registry
#
# THE SOURCE OF TRUTH. Every table column, migration, continuous-aggregate expression,
# Rust field, protobuf field, OpenAPI property and TypeScript property is generated from
# this file by `cargo xtask codegen`. Nothing downstream is hand-maintained.
#
# Three rules, enforced by the generator against metrics/snapshot.toml:
#   1. `key`, `column` and `field_number` are allocated once and NEVER reused (D-21).
#   2. Removing a metric sets `deprecated = true`. It does not delete the entry and it
#      does not free the identifiers.
#   3. Renames, SQL/protobuf type changes and aggregation-strategy changes are refused
#      unless the operator passes --allow-breaking. See docs/metric-registry.md §4.
#
# Bootstrapped from the Go implementation's own definition (215 columns in
# internal/types/weather.go and internal/storage/timescaledb/sql.go at remoteweather
# c3ec9f7). Production carries ~143 columns; the ~72-column gap is real, is a defect in
# the old system, and is W9's to reconcile (OQ-6). No column was dropped to hide it.

schema_version = 1

[defaults]
# How a stored mean is represented. "sum_count" emits <col>_sum + <col>_count;
# "stats_agg" emits one <col>_stats column. W4 decides (OQ-3); both are expressible
# here and both are emittable by the generator. Overridable per metric.
mean_representation = "sum_count"
# Default per-level inclusion for a metric that does not name its own `levels`.
levels = ["1m", "1h", "1d"]

# The aggregate hierarchy (D-11). Each level reads the level named in `source`,
# never raw except for the first. The Go 5-minute level is deliberately absent.
#
# `levels` on a metric must be contiguous from "1m": a level reads the level below
# it, so a metric cannot appear at "1h" unless "1m" carries it. See
# docs/metric-registry.md OQ-W2-1 — this is why OQ-5 cannot be answered as written.
# `materialized_only` is W4's to tune (real-time aggregation vs materialised only);
# true is required of any level that is itself the source of another.
[[level]]
name = "1m"
bucket = "1 minute"
source = "raw"
materialized_only = true

[[level]]
name = "1h"
bucket = "1 hour"
source = "1m"
materialized_only = true

[[level]]
name = "1d"
bucket = "1 day"
source = "1h"
materialized_only = true

# ---------------------------------------------------------------------------
# Dimensions: columns the generated types need that are not measurements.
# They share the column-name and protobuf-number namespace with metrics, so the
# generator checks uniqueness across both lists. They carry no aggregation
# strategy: `time` becomes the bucket, `station_id` the GROUP BY key, and the two
# attribute columns ride along in the aggregate grouping.
# ---------------------------------------------------------------------------

[[dimension]]
key = "time"
column = "time"
sql_type = "timestamptz"
role = "time"
field_number = 1
proto_name = "readingTimestamp"
proto_type = "google.protobuf.Timestamp"
label = "Time"
introduced_in = "0.1.0"
legacy_rest_keys = ["ts"]

[[dimension]]
key = "station_id"
column = "station_id"
sql_type = "text"
role = "partition"
field_number = 221
proto_name = "station_id"
proto_type = "string"
label = "Station"
introduced_in = "0.1.0"
# New in the Rust design: the Go table keys readings by station *name*.
# Protobuf 221 was already allocated to station_id upstream and means the same
# thing, so it is carried over rather than reallocated.

[[dimension]]
key = "station_name"
column = "stationname"
sql_type = "text"
role = "attribute"
field_number = 2
proto_name = "stationName"
proto_type = "string"
label = "Station name"
introduced_in = "0.1.0"
legacy_rest_keys = ["stationname"]

[[dimension]]
key = "station_type"
column = "stationtype"
sql_type = "text"
role = "attribute"
field_number = 3
proto_name = "stationType"
proto_type = "string"
label = "Station type"
introduced_in = "0.1.0"
legacy_rest_keys = ["stationtype"]

