# The lint half of docs/service-architecture.md §1.4's third mechanism, and of §3.2's leak
# invariant.
#
# One timer heap and one task table replace 21 hand-rolled clocks and a `map[string]
# context.CancelFunc`, which only stays true while nothing else can spawn or tick. The
# layout gate cannot see this: `tokio` is a legitimate dependency of six crates, and the
# question is which MODULE may call these four functions, not which crate may link them.
#
# `mw-supervisor::task` and `mw-supervisor::clock` are the permitted call sites and carry an
# `#[allow(clippy::disallowed_methods)]` with a comment; they arrive with
# implementation-plan.md M2-3. Nothing calls any of these today, so this file currently
# forbids nothing -- which is the right moment to add it, because it never has to be
# retrofitted against existing call sites.
disallowed-methods = [
  # One entry, not two: `tokio::spawn` is a re-export of `tokio::task::spawn`, so a call
  # written either way resolves to the latter and clippy reports it under that name. A
  # separate `tokio::spawn` entry matched nothing, and its reason string was unreachable.
  { path = "tokio::task::spawn", reason = "spawn through mw_supervisor::task, so the task table owns the handle and a leak is unexpressible (§3.2)" },
  { path = "std::thread::spawn", reason = "a blocking worker belongs to mw_supervisor::task like any other task (§3.2)" },
  { path = "tokio::time::interval", reason = "there is one clock for the whole process, in mw_supervisor::clock (§3.3)" },
]
