# NOT applied by kustomization.yaml, and deliberately not a real secret.
#
# The superuser password is the one input these manifests do not carry, because a
# password in git is a password that has to be rotated the moment the repository is
# cloned. Create it once, out of band:
#
#   kubectl -n modernweather create secret generic modernweather-db-superuser \
#     --from-literal=password="$(openssl rand -base64 36 | tr -d '\n')"
#
# It is read only at initdb -- the image writes it into the cluster's own authentication
# on first boot -- so changing this Secret later does NOT change the database password.
# Use ALTER ROLE for that, and update the Secret to match.
apiVersion: v1
kind: Secret
metadata:
  name: modernweather-db-superuser
  namespace: modernweather
type: Opaque
stringData:
  password: replace-me
