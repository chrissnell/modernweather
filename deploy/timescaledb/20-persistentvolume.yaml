# The data volume: /dev/sda7, xfs, on a Samsung SSD 850 (SATA, rotational=0), mounted by
# Talos at /var/mnt/modernweather-db. Talos owns the mount; Kubernetes only points at it.
#
# `local` and not NFS, which docs/reconciliation.md §7.3 records as the one hard
# constraint on this workload: a durable aggregate refresh is dominated by WAL fsync
# (A-W4-3), so disk LATENCY is the specification and capacity is not. Measured on this
# device through this volume, `pg_test_fsync -s 3`: 2207 us/op open_datasync,
# 2767 us/op fdatasync. Those numbers are the baseline W4 D-26's 10-second refresh
# deadline gets judged against in M5-1; nothing here is tuned off them.
#
# Capacity is informational for a no-provisioner volume -- the filesystem is whatever
# Talos mounted -- but it is what a PVC's request is matched against, so it tracks the
# real figure.
#
# The nodeAffinity is what makes this safe AND what makes it a single point of failure:
# the pod can only ever run on lil-bulky, and if that node is down the pod is `Pending`.
# That is what a `local` volume means, it was accepted explicitly (§7.4), and M0-2's
# off-site backup is the condition that makes it acceptable.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: modernweather-db-lil-bulky
  labels:
    app.kubernetes.io/part-of: modernweather
    node: lil-bulky
spec:
  capacity:
    storage: 350Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: modernweather-db-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/modernweather-db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - lil-bulky
