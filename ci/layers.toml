# The crate-boundary manifest. `cargo xtask gate-layout` reads this file and nothing else;
# `ci/gates.toml` declares it as the gate `layout`, armed by `crates/mw-types/Cargo.toml`.
#
# Why a file rather than a code review. W3 decision 1's entire argument for eighteen crates
# rather than one is that "forbidden to depend on" is only enforceable as a Cargo.toml
# fact. Cargo enforces the edges that exist -- a crate that does not list `mw-store` in
# `[dependencies]` cannot write `use mw_store::...`, and the compiler says so. It does not
# enforce the edges that must never be ADDED, and adding one is a single reviewable line
# that a reviewer has to remember to object to. docs/reconciliation.md G-4 is what happens
# when a decision has no mechanism: it becomes a code-review preference within a release or
# two. This file is the mechanism.
#
# Six kinds of declaration:
#
#   layers           the layer order, lowest first
#   exempt_members   workspace members deliberately outside the gate
#   [[crate]]        layer, the crates and third-party crates it may not name, and the
#                    strings its own source may not contain
#   [[dep_rule]]     a dependency only certain crates may declare
#   [[source_rule]]  a string only certain crates' source may contain
#   [templates]      the escaping rule for crates/mw-web/templates
#   [generated]      the do-not-edit header every generated file must carry
#
# Plus four structural checks that are not declarations, because there is nothing to decide
# about them:
#
#   members          every `[workspace] members` entry is `crates/*`, or a declared crate
#                    under crates/, or in `exempt_members`
#   roster           every crate directory under crates/ appears in exactly one `[[crate]]`
#                    and every `[[crate]]` exists on disk, with the package name agreeing
#   workspace-pinned-dependencies
#                    every dependency in a crates/* manifest is `workspace = true` or a
#                    path to a declared crate -- the allowlist that makes the denylists
#                    below a complete answer
#   unscanned-source every .rs file under crates/ is inside a declared crate, so the source
#                    rules below are blind to nothing
#
# Those four exist because the gate's view of the workspace used to be a directory listing
# of crates/, and three separate one-line bypasses followed from that: a member outside
# crates/, a `#[path]` into a directory outside any crate, and a dependency pinned locally
# rather than centrally.
#
# The dependency checks read `[dependencies]`, `[dev-dependencies]`, `[build-dependencies]`
# AND every `[target.'cfg(...)'.dependencies]` table, and they resolve `package = "..."`
# renames, including through `[workspace.dependencies]`. Dev-dependencies are included on
# purpose: W2a assumption 7 requires a golden test for the APRS encoder to link without a
# database or a transport, and that property is destroyed by a dev-dependency as surely as
# by a dependency. The target tables are included because `cfg(unix)` is true on all four
# release triples, so `[target."cfg(unix)".dependencies]` is an ordinary dependency wearing
# a hat.

# ---------------------------------------------------------------------------------------
# Layer order, lowest first. A crate may depend only on crates in a STRICTLY LOWER layer,
# which also means same-layer dependencies are rejected -- so a `forbidden` list below
# only has to name third-party crates and the lower-layer crates that must still be out of
# reach. docs/service-architecture.md §1.4 states the order over crate names:
#
#   types < proto|codec|aprs|obs < component < supervisor|store|pipeline|http|station
#         < api-legacy|web|grpc|output|collector|api-mgmt < bin
#
# The names below are that grouping, nothing more.
layers = ["types", "pure", "component", "service", "surface", "bin"]

# The repository task runner. It is a workspace member and it is deliberately outside every
# rule in this file: it is not part of the daemon, it ships to nobody, and it is where this
# gate itself lives. Recorded rather than implied, so that a reader can tell
# exempt-by-design from forgotten -- and the `members` check rejects a stale entry here as
# well as an uncovered member there.
exempt_members = ["xtask"]

# ---------------------------------------------------------------------------------------
# The eighteen crates of docs/service-architecture.md §1.2. `forbidden` is the column of
# that table that matters.

[[crate]]
name = "mw-types"
layer = "types"
responsibility = "Domain types; the one adopter of generated/rust/*.rs"
# "everything" in §1.2. The layer rule already rejects every workspace crate, since this is
# the lowest layer and nothing is below it. These are the third-party names §1.2 calls out:
# no runtime, no database, no transport, and -- the load-bearing one -- no `serde`, because
# a `#[serde(rename = "otemp")]` in the domain type is how legacy naming leaks into the core
# (§1.7). It would have to add `serde` here first, and this line rejects that.
forbidden = ["tokio", "tokio-util", "sqlx", "axum", "tonic", "serde", "serde_json", "rmp-serde"]

[[crate]]
name = "mw-proto"
layer = "pure"
responsibility = "The wire types: prost + pbjson over generated/proto/reading.proto"
forbidden = ["sqlx", "axum", "mw-store", "mw-api-legacy"]

[[crate]]
name = "mw-codec"
layer = "pure"
responsibility = "Pure frame -> Vec<PartialReading> decoders"
forbidden = ["tokio", "tokio-util", "sqlx", "axum", "tonic"]
# §1.2: no `tokio`, no `std::net`, no `std::fs`, and no clock. "A codec that can read the
# time is not golden-testable" is the reason, and it is the only one of the four that a
# manifest cannot express -- `chrono` is a legitimate dependency for a timestamp TYPE and
# becomes a clock the moment someone calls `now()`. M3-1's done-criteria say this crate's
# purity is "enforced by the layout gate", so it is enforced here rather than reviewed.
forbidden_source = ["::now(", "std::net", "std::fs", "tokio::"]

[[crate]]
name = "mw-aprs"
layer = "pure"
responsibility = "Pure APRS/CWOP protocol: encode, decode, base-91, passcode"
forbidden = ["tokio", "tokio-util", "sqlx", "axum", "tonic"]
forbidden_source = ["::now(", "std::net", "std::fs", "tokio::"]

[[crate]]
name = "mw-obs"
layer = "pure"
responsibility = "tracing setup, the reload handle, the ring/dedupe/access-log layers, the metrics recorder"
# §1.2: "everything but mw-types". Every workspace crate is same-layer or higher, so the
# layer rule covers them; these are the third-party names that would mean this crate had
# started doing someone else's job.
forbidden = ["sqlx", "axum", "tonic"]

[[crate]]
name = "mw-component"
layer = "component"
responsibility = "The component model as code, and every capability handle trait"
# §1.2: "every concrete component crate. It must not know that a station or a database
# exists." The crates are all higher layers; `sqlx` is the database half of that sentence.
forbidden = ["sqlx", "axum", "tonic"]

[[crate]]
name = "mw-supervisor"
layer = "service"
responsibility = "plan(), the hard-edge digraph, one timer heap, the task table, the fan-out"
forbidden = ["sqlx", "axum", "tonic", "mw-store", "mw-pipeline", "mw-station", "mw-http"]

[[crate]]
name = "mw-store"
layer = "service"
responsibility = "sqlx against PostgreSQL and SQLite; owns the pools and the store implementations"
# "The storage layer must not be able to name an endpoint" (§1.2).
forbidden = ["axum", "tonic", "tower-http", "mw-api-legacy", "mw-web", "mw-grpc", "mw-api-mgmt"]
# `unwrap_or_default()` on an `Option<f32>` is `zf` with a different name, and this is one of
# the two crates where §1.7's named consequence lands: a stored 0.0 that nothing can
# distinguish from a reading the sensor actually sent. The rule is not "do not default", it
# is "say what the default is" -- `unwrap_or_else(String::new)` for the harmless cases reads
# as a decision, which `unwrap_or_default()` does not.
forbidden_source = ["unwrap_or_default"]

[[crate]]
name = "mw-pipeline"
layer = "service"
responsibility = "The OnReading path: Ingress, enrich, Sink, SpooledSink and the pipeline components"
# It holds HANDLES, not implementations (§1.3 rule 1) -- which is also what makes decision
# 87 ("admit does no I/O but the spool append") structurally true rather than aspirational.
forbidden = ["sqlx", "axum", "tonic", "mw-store"]
# The other half of mw-store's rule: this is the crate that builds the row that gets written.
forbidden_source = ["unwrap_or_default"]

[[crate]]
name = "mw-station"
layer = "service"
responsibility = "Transport, Session, StationIdentity, identity resolution and the station components"
forbidden = ["sqlx", "axum", "tonic", "mw-store", "mw-api-legacy", "mw-web"]

[[crate]]
name = "mw-http"
layer = "service"
responsibility = "The one listener: axum + tonic, RouteTable mounting, host routing, the SNI resolver"
# "It mounts route tables; it does not know what is in them" (§1.2). The converse of this
# crate's monopoly on binding is that it may not reach what it serves.
forbidden = ["sqlx", "mw-store", "mw-pipeline", "mw-api-legacy", "mw-web"]

[[crate]]
name = "mw-api-legacy"
layer = "surface"
responsibility = "The compatibility adapter: the 133-key DTO, the duplicate keys, the unit split, the zero-fill"
# It is handed LatestSnapshot and the read stores as capability handles, so the /latest
# handler CANNOT query -- not "does not", cannot (W2a decision 35).
forbidden = ["sqlx", "mw-store"]

[[crate]]
name = "mw-web"
layer = "surface"
responsibility = "The public website: askama templates, embedded assets, the inline config block"
forbidden = ["sqlx", "mw-store", "mw-proto", "mw-api-legacy"]

[[crate]]
name = "mw-grpc"
layer = "surface"
responsibility = "WeatherV1 and WeatherAppsV1 as tonic services over the shared router"
forbidden = ["sqlx", "mw-store"]

[[crate]]
name = "mw-output"
layer = "surface"
# Widened by implementation-plan.md M6-3 and recorded as docs/reconciliation.md A-M6-3-2:
# §1.2's eighteen crates assign the Aeris components no home, and the one thing those
# components need that no lower-layer crate has is the outbound HTTPS request with a public
# trust anchor that the `webpki-roots-only-for-the-uploaders` rule below confines to this
# crate. The `forbidden` list is unchanged and covers the new half for the same reason it
# covers the old one: the fetchers write through capability handles and name no SQL.
responsibility = "Third-party HTTPS integrations: rate-limited outputs, and the Aeris fetchers"
# W2a decision 50 -- "no SQL in the radio component" -- made structural (§1.3 rule 3).
forbidden = ["sqlx", "mw-store"]

[[crate]]
name = "mw-collector"
layer = "surface"
responsibility = "W7's uplink and gRPC receiver"
forbidden = ["sqlx", "mw-api-legacy", "mw-web"]

[[crate]]
name = "mw-api-mgmt"
layer = "surface"
responsibility = "W5's server half: the management API over ConfigAdmin and ComponentControl"
# "mw-store directly (it uses ConfigAdmin), mw-pipeline" (§1.2).
forbidden = ["sqlx", "mw-store", "mw-pipeline"]

[[crate]]
name = "modernweather"
layer = "bin"
responsibility = "The binary: arguments, the SQLite pool, the subscriber, plan(), the supervisor"
# The only crate with no forbidden list, because it is the only place a capability consumer
# and its provider are allowed to meet (§1.3 rule 1).
forbidden = []

# ---------------------------------------------------------------------------------------
# Dependencies only certain crates may declare.

[[dep_rule]]
id = "anyhow-only-at-the-binary-boundary"
dependency = "anyhow"
only = ["modernweather"]
reason = """
DESIGN.md D-32 and docs/service-architecture.md §4: `thiserror` per module, `anyhow` at the
binary boundary. The distinction is not style. A module error is an enum with a
classification that drives retry (§4.2), so `Retryable` and `Fatal` are decided once, by the
type, rather than re-decided at each call site. `anyhow::Error` has no classification, so
one `anyhow` in a library crate silently converts a decision into a string -- and the
supervisor then has nothing to branch on. The binary is where the last answer really is
"print it and exit", which is the one place `anyhow` is right."""

[[dep_rule]]
id = "go-number-digits"
dependency = "ryu"
only = ["mw-api-legacy", "mw-web"]
reason = """
`[workspace.dependencies]`'s entry for `ryu` has always said "`mw_api_legacy::dto` is the only
crate that may name this, because it is the only one that has to produce Go's bytes
(ci/layers.toml)" -- and until implementation-plan.md M4-3 this file carried no such rule, so
that sentence described a gate that did not exist. It does now, and it names **two** crates
rather than one.

Why two. `encoding/json` formats a float with `strconv.AppendFloat(b, f, fmt, -1, bits)`, which
is ryu and breaks a shortest-representation tie round-half-to-even; Rust's `Display` is
Grisu/Dragon and breaks the same tie round-half-up. Two surfaces have to reproduce Go's bytes
and they are in the same layer, so neither may name the other: `mw-api-legacy` owns the frozen
DTO's numbers, and `mw-web` owns the two coordinates in the rendered page's `radar-config`
block, which `contract/fixtures/html-weather-station` records as ` 39.9 ` and ` -105.5 ` --
padding included, because `html/template` escapes that block as JavaScript.

What stops the two drifting is `crates/modernweather/tests/go_numbers.rs`, which sweeps f64 bit
patterns and asserts `mw_api_legacy::dto::go_float64` and `mw_web::gojs::json_f64` agree. The
binary is where that test can live: it is the one crate that may name both (§1.3 rule 1).

Adding a third crate here needs the same treatment -- a reason, and an assertion against one of
the existing two. "Three answers to what Go's digits are" is how a frozen number changes in one
place and not another.
"""

[[dep_rule]]
id = "webpki-roots-only-for-the-uploaders"
dependency = "webpki-roots"
only = ["mw-output"]
reason = """
Added by implementation-plan.md M6-2 and recorded as amendment A-M6-2-1 in
docs/reconciliation.md: DESIGN.md D-32 names `rustls` + `ring` for TLS and names **no HTTP
client**, which left the outbound upload path without a trust anchor source. `mw_output::https`
writes the request out by hand rather than adding a client crate -- the same trade
`mw_station::http` makes, and for the same `clippy.toml` reason -- so the root store is the
one piece of it that cannot be written out.

Confined to one crate because that is the only honest scope for it. The daemon's SERVER side
has no use for a public trust store: `mw_http::sni` resolves certificates this node owns. A
second WORKSPACE crate naming this would mean something had started verifying a public
endpoint somewhere the design does not have one -- which is exactly the kind of edge W3
decision 1 says is only enforceable as a Cargo.toml fact.

Two limits of that, both worth knowing before someone over-reads the rule. The gate inspects
`crates/*` manifests only, so a crate can still acquire public-root verification
TRANSITIVELY without tripping it -- and one already has: `sqlx-core` depends on
`webpki-roots` 0.26, so a `postgres://...?sslmode=verify-full` URL with no operator CA
verifies against the same anchor data. That is not a second trust store in the binary (both
versions resolve to one copy of the data), and it is not this rule's business either: what
this rule governs is a crate CHOOSING to verify a public endpoint, not a driver's own TLS
defaults.

Compiled in rather than read from the platform store, which is the part worth knowing before
somebody "fixes" it: the daemon ships as a static musl binary to four targets and into a
container whose `/etc/ssl/certs` is the base image's, so a platform store is a trust decision
that differs per artefact. `rustls-native-certs` and `rustls-platform-verifier` are therefore
NOT substitutions that would be equivalent here, and either would be its own amendment."""

[[dep_rule]]
id = "one-logging-path"
dependency = "log"
only = []
reason = """
docs/service-architecture.md §5.1: `tracing` macros only, nowhere a `log::` macro. The Go
version has a package-global sugared logger AND an injected one, used interchangeably inside
the same functions, which is why its output cannot be filtered per station. `mw-obs`
installs `tracing_log::LogTracer` so that DEPENDENCY crates using `log` -- `sqlx`, `hyper`,
`rustls` -- still land in the pipeline; a workspace crate declaring `log` itself is the
second path reappearing."""

# ---------------------------------------------------------------------------------------
# Strings only certain crates' source may contain. Every `.rs` file under a crate directory
# is scanned, which includes `tests/` and any `build.rs`.

[[source_rule]]
id = "only-mw-types-adopts-generated-rust"
needles = ["generated/rust/"]
only = ["mw-types"]
reason = """
docs/service-architecture.md §1.6: exactly one file in the workspace references the
generated Rust, `crates/mw-types/src/generated/mod.rs`, and the module it declares is
private. `mw-types` re-exports what the rest of the workspace needs, so "just add a field to
the generated struct" has nowhere to land, and a hand-written addition to a generated type
has one home: an `impl` block in `crates/mw-types/src/ext.rs`."""

[[source_rule]]
id = "only-mw-types-and-the-proto-build-script-mention-generated"
needles = ["generated/"]
only = ["mw-types", "mw-proto"]
reason = """
§1.4 states this rule as "no crate other than mw-types mentions the path generated/", and
§1.6 of the same document requires `mw-proto`'s build script to parse
`generated/proto/reading.proto` with `protox`. Taken literally the first forbids the second,
so the two are reconciled here rather than left for whoever writes that build script to
discover: `mw-proto` may name the proto SCHEMA, and the rule above still gives `mw-types`
sole access to the generated RUST. The distinction is the one the decision is actually
about -- a hand-written module must not be able to reach a generated TYPE.

The `mw-proto` half of this exemption has landed: implementation-plan.md M3-2 wrote that
build script, because the spool record's payload is the wire `collector.v1.Envelope`
(W7 D-11) and that message imports the generated `reading.proto`.

The previous note here said the `only` entry should then narrow to `build.rs` alone. **It
does not, and the reason is the scan rather than the decision.** This check is a
whitespace-squeezed substring match over whole files and does not know what a comment is, so
narrowing it to one path makes every doc comment in the crate that NAMES the schema a gate
failure -- including the module doc that exists to tell a reader where the types come from.
The choice would be between worse documentation and a weaker gate, and it is a false choice:
the rule that actually enforces the decision is `only-mw-types-adopts-generated-rust` above,
whose needle is `generated/rust/` and whose `only` list does NOT include `mw-proto`. A
hand-written module still cannot reach a generated TYPE. What is left here is the schema
PATH, and naming a path in prose is not reaching it.

`collector.proto` itself is hand-written and lives at `crates/mw-proto/proto/`, NOT under
`generated/`, even though docs/collector.md §4.1 writes the latter path. It has to: the
`[generated]` check below requires a DO-NOT-EDIT header on everything in that directory, and
implementation-plan.md M1-3's prune deletes anything there the generator does not write — so a
hand-written file there would survive until the next `cargo xtask codegen`. Nothing in that
schema derives from `metrics/registry.toml` except the `Reading` it imports."""

[[source_rule]]
id = "one-seam"
needles = ["#[path"]
only = ["mw-types"]
reason = """
docs/service-architecture.md §1.6 says exactly one file in the workspace references generated
code, and that file uses `#[path]`. The same attribute is also the one way a module's SOURCE
can live outside the directory the crate owns -- `#[path = "../../../shared/x.rs"]` compiles
fine and puts the code where every source rule in this file is blind to it. The
`unscanned-source` check covers a stray .rs UNDER crates/; this covers one outside it.

So the uniqueness §1.6 states in prose is a checked fact, and the cost is nil: `#[path]` has
no other legitimate use here. If one arrives, it gets a line in this `only` list and a reason,
which is a visible decision."""

[[source_rule]]
id = "only-mw-http-binds-a-socket"
needles = [
  "axum::serve",
  "tonic::transport::Server",
  "transport::Server",
  "Server::builder",
  "TcpListener",
  "UnixListener",
  "TcpSocket::bind",
]
only = ["mw-http"]
reason = """
docs/service-architecture.md §1.4 and §1.5: the direct structural answer to seven
listener-owning sites in the Go tree and to a single type that owned an HTTP server, an
HTTPS server and a gRPC server at once. TLS is a resolver rather than a second server, and
gRPC shares the socket by ALPN, so there is exactly one place a listener can exist.

§1.4 names three needles. The list is longer because the three it names are fully-qualified
paths, and the idiomatic way to write any of them imports a prefix first:
`use tonic::transport::{Channel, Server};` makes the path `tonic::transport::Server` appear
on no line at all. So the type names are needles too, and `Server::builder` catches the call
site when the import was a brace group.

`UdpSocket::bind` is deliberately NOT here. §1.4 names listeners, and a receive socket is not
one: implementation-plan.md M3-1 requires WeatherLink Live discovery over UDP broadcast in
`mw-station`, so forbidding it would forbid a driver the plan calls for. The asymmetry is the
decision, not an oversight."""

[[source_rule]]
id = "one-zero-fill"
needles = [
  "unwrap_or(0.",
  "unwrap_or(0f32",
  "unwrap_or(0_f32",
  "unwrap_or(0f64",
  "unwrap_or(0_f64",
  "unwrap_or_else(|| 0.",
  "map_or(0.",
  "map_or(0f32",
  "map_or(0_f32",
  "map_or(0f64",
  "map_or(0_f64",
]
only = ["mw-api-legacy"]
reason = """
docs/service-architecture.md §1.7. The domain type is `Option<f32>` end to end and the
writer stores NULL for a metric a station did not report -- that is D-3's density premise and
D-9's nullable ADD COLUMN. The frozen contract's zeros are produced one layer later, at the
DTO, by exactly one function: `fn zf(v: Option<f32>) -> f32 { v.unwrap_or(0.0) }`. A second
zero-fill anywhere else means storage and presentation have been confused, and the symptom
would be a zero in the database that nothing can distinguish from a reading.

The needles are prefixes on purpose: `unwrap_or(0.` is `unwrap_or(0.0)`, `unwrap_or(0.)` and
`unwrap_or(0.0f32)` in one line, and the gate reports one violation per offending line however
many of them match.

The `f64` and `map_or` spellings were added by M4-2's code review, which pointed out that the
`f32` forms were listed for both combinators and the `f64` forms for neither -- an asymmetry
with no reason behind it, and `zf64` exists precisely because this surface has `f64` fields.
`unwrap_or_else(|| 0.` is the closure spelling, which no literal prefix would have caught.
Nothing in the tree violated any of them; this is the gate catching the next one rather than
the last one.

`unwrap_or_default()` is the same mistake with no literal to match at all, so it is handled
where it would do damage -- `forbidden_source` on `mw-store` and `mw-pipeline` -- rather than
banned workspace-wide, where it is often the right call on an `Option<String>`. That leaves
`mw-output` and `mw-aprs` free to zero-fill an `Option<f32>` on its way to CWOP, which is the
same confusion one layer sideways; it is not this item's surface, and it is recorded here so
the next reader does not have to rediscover the hole."""

[[source_rule]]
id = "no-stdout-logging"
needles = ["println!", "eprintln!", "print!", "eprint!", "dbg!", "io::stdout", "io::stderr"]
only = []
only_paths = [
  "crates/modernweather/src/args.rs",
  "crates/mw-obs/src/stderr.rs",
  "crates/mw-proto/build.rs",
]
reason = """
docs/service-architecture.md §5.1 allows these only on the binary's argument-parsing path,
which is the one place a message has to reach a terminal before a subscriber exists. The
crate used to be the finest unit this gate could enforce, and the note here said the
narrowing arrives with implementation-plan.md M2-4, which writes that path. It has: `only`
is now empty and two FILES are exempt, so a `println!` anywhere else in the binary --
including in a handler somebody debugs and forgets -- is a gate failure rather than a
convention.

Two paths, not one, because the rule's needles cover two different things. `println!` and
friends belong to the pre-subscriber path: `crates/modernweather/src/args.rs` prints
`--help`, prints the usage after a rejected command line, and carries the one `eprintln!`
that reports a failure which happened before (or instead of) the subscriber -- a daemon
that exits 1 silently is what `Type=notify` was adopted to stop.

`io::stderr` is the other half, and `mw-obs` is where it has to be: §5.1's rule is "`tracing`
macros only", and the stream `tracing` writes to has to be named somewhere. Collecting every
environment read and the locked `write_all` into `crates/mw-obs/src/stderr.rs` makes that one
file rather than one crate, which is also why the format detection next to it is a pure
function over four booleans.

A path here must exist: `cargo xtask gate-layout` fails to LOAD if one does not, so an
exemption that outlives the file it names cannot quietly widen the rule back out. The
exact set is also asserted by a test, because widening it one file at a time is the gradual
version of the hole this narrowing closed.

The third path is a **build script**, and it is exempt for a reason that is not about
logging at all: `cargo::rerun-if-changed` and every other build-script directive is
delivered to cargo on **stdout**, and `println!` is the only way to write one. There is no
alternative API to point at. `crates/mw-proto/build.rs` emits one directive per schema it
parses so that an edit to `generated/proto/reading.proto` rebuilds the crate; without them
the prost output would go stale against a gated input, which is the one thing
docs/service-architecture.md §1.6 relies on when it declines to commit that output.

One property of the narrowing worth knowing before it surprises somebody: the scan is a
whitespace-squeezed substring match over the whole file, so it does not know what a comment
is. A doc comment in the binary that NAMES `println!` -- while explaining this rule, say --
is a violation now that the crate is no longer exempt. `crates/modernweather/src/args.rs`
contains exactly that, and passes only because it is one of the exempt paths."""

[[source_rule]]
id = "no-template-escape-opt-out"
needles = [
  'escape = "none"',
  "escape = 'none'",
  "|safe",
  '|e("none")',
  "|e('none')",
  "filters::Safe",
  "MaybeSafe",
  "HtmlSafeOutput",
]
only = []
only_paths = ["crates/mw-web/src/page.rs"]
reason = """
The `[templates]` check below reads the template files. This one reads Rust, because the
strongest forms of the same opt-out are not in a template at all.

Three kinds. `#[template(escape = "none")]` on the derive turns escaping off for the WHOLE
template, is one attribute rather than one expression, and is easier to write than a filter.
The filter spellings are here as well as in `[templates]` below, because
`#[template(source = "...", ext = "html")]` puts a template in a Rust file, where the
`[templates]` directory scan never reads it. The rest are WRAPPER TYPES -- `askama::filters::Safe<T>`, `MaybeSafe` and
`HtmlSafeOutput<T>` -- which bypass escaping for a single field with nothing appearing in the
template at all, so neither the `[templates]` needles nor a reading of the template would
find one. M4-3's code review is why they are listed: its fix for one real defect is the only
legitimate use of a bypass in this workspace, and a rule that did not name it would not have
noticed the next one.

`askama::filters::HtmlSafe` is deliberately NOT a needle, and that is the defect the review
found rather than an omission: its bypass is implemented only for askama's own `Html`
escaper, and `crates/mw-web/askama.toml` registers a custom one -- so an `impl HtmlSafe`
does nothing, which is why `crates/mw-web/src/gojs.rs` no longer has one. Forbidding a
no-op would be noise; `crates/mw-web/src/page.rs`'s own test is what keeps the real bypass
to its two fields.

`only` is empty and ONE path is exempt. `crates/mw-web/src/page.rs` wraps the rendered
page's two coordinates, because Go writes `1e+21` for a magnitude outside `[1e-6, 1e21)` and
`html/template`'s table turns `+` into `&#43;` -- which is not JSON inside the
`<script type="application/json">` block the page carries, so `JSON.parse` throws and the
radar panel never initialises. The value bypassing the escaper is a PRIVATE newtype whose
only constructors take an `f64` and an `i64`, so no string can travel through it, and
`crates/mw-web/src/page.rs`'s
`the_only_escaping_bypasses_in_this_file_are_the_two_coordinates` reads the file and asserts
that is still true. W3 decision 81's reasoning -- `askama` escapes by default, so an explicit
opt-out is the only way such a template emits unescaped output -- is why the exemption is one
file, one reason and one test rather than a convention.

A path here must exist: `cargo xtask gate-layout` fails to LOAD if one does not, so an
exemption that outlives the file it names cannot quietly widen the rule back out."""

# ---------------------------------------------------------------------------------------

[templates]
dir = "crates/mw-web/templates"
needles = ["|safe", 'escape("none")', "escape('none')", '|e("none")', "|e('none')"]
escaper_config = "crates/mw-web/askama.toml"
escaper_path = "crate::GoHtmlEscaper"
escaper_extensions = ["html", "htm"]
reason = """
W3 decision 81. `askama` is chosen because it is compile-time checked, so a missing field is
a build error rather than a request-time one -- and escaping is on by default, so the only
way such a template can emit unescaped output is an explicit opt-out.

Four spellings are rejected here: `|safe`, `escape("none")`, `escape('none')`, and `|e(...)`,
which is askama's documented alias for the `escape` filter. The fifth lives in Rust rather
than in a template and is handled by `no-template-escape-opt-out` above. Whitespace is
ignored, so `{{ x | safe }}` is caught as well as `{{ x|safe }}`.

**The `askama.toml` hole is now covered too.** An earlier version of this note said: "an
`askama.toml` that reassigns the `html` escaper would turn escaping off globally without any
of these appearing anywhere. There is no such file, and the day one arrives it needs a rule
of its own." The day arrived with implementation-plan.md M4-3: the byte diff against W1's
recorded bodies is achievable only with Go's spellings -- `html/template` writes `&#34;` and
`&#39;` where askama's own `Html` escaper writes `&quot;` and `&#x27;` -- so
`crates/mw-web/askama.toml` registers `mw_web::GoHtmlEscaper`, and `escaper_config`,
`escaper_path` and `escaper_extensions` above are the rule.

Three ways to break it, all checked: a different `path` (`askama::filters::Empty` writes its
input unchanged), a missing extension, and a **second** `[[escaper]]` entry -- askama takes
the first match, so an entry added above the real one silently wins. A missing or unparseable
file is a violation rather than a skip, for the same reason a stale `only_paths` entry is a
load failure: "the gate stopped applying because the file was deleted" is the failure mode
this whole file is arranged against."""

[generated]
dir = "generated"
header = "DO NOT EDIT"
reason = """
docs/service-architecture.md §1.6, rule 3. W2 gates the forward direction -- `generated/`
matches `metrics/registry.toml` -- and this is the converse: nothing hand-written is ever
placed in `generated/`. A file there without the header is either a hand-written addition,
which the drift check would delete on the next `cargo xtask codegen`, or a generator that has
stopped announcing itself."""
