# Deferred-gate manifest.
#
# W8 lands before the work items whose output several of the gate's checks exist to
# check. A gate that simply skips in that situation is worse than no gate, because it
# keeps reporting green after the thing it guards arrives. So every such check is
# declared here with the file whose existence arms it, and `cargo xtask gate <id>` reads
# this file rather than a human's memory:
#
#   arms_when path absent  -> print DEFERRED, exit 0
#   arms_when path present -> run `cmd`, exit with its status
#
# Nobody has to remember to turn a gate on. The work item that creates the file turns it
# on, and `cargo xtask gates` prints the current state into every PR's job summary so the
# deferred set is visible rather than forgotten.
#
# Adding a gate here is not a way to defer work you own. It is for checks whose subject
# is owned by another work item.
#
# A gate may also declare what one exit code of its command means:
#
#   on_exit.<code> = "..."  -> printed in place of `note` when the command exits <code>
#
# `note` stays the catch-all for a code nobody declared. This exists because W2 D-18 gave
# `cargo xtask codegen --check` two failure codes on purpose -- 1 is drift, 2 is a violated
# invariant -- and the runner mapped both to one error string, so CI said "the gate failed"
# for two problems whose fixes are different (docs/reconciliation.md C-W2-20). `cargo xtask
# gate <id>` now exits with the command's own code, so the distinction survives out of
# xtask as well as into the log.

[[gate]]
id = "codegen-drift"
description = "Generated output matches what the metric registry generates today"
owner = "W2 (metric registry)"
arms_when = "metrics/registry.toml"
cmd = ["cargo", "xtask", "codegen", "--check"]
note = """
DESIGN.md R-2: the check regenerates into a temporary directory and diffs. It must never
write into the working tree, because a check that fixes the problem it is checking for
always passes."""
on_exit.1 = """
generated/ does not match metrics/registry.toml: regenerate and commit. Run `cargo xtask
codegen` and commit its output together with the registry change -- the listing above names
every file that differs. The working tree was not modified by the check."""
on_exit.2 = """
your registry change is not allowed. An invariant in metrics/registry.toml was violated, so
nothing was generated and there is nothing to commit; the violation is printed above, and
`cargo xtask validate` reproduces it on its own. W2 D-18 gave this its own exit code because
the fix is the opposite one: change the registry edit, do not regenerate against it."""

[[gate]]
id = "legacy-import-drift"
description = "The Go-to-Rust migration SQL matches the registry and the Go view inventory"
owner = "W9 (data migration)"
arms_when = "ci/db/migrate-from-go/go-aggregate-views.toml"
cmd = ["cargo", "xtask", "legacy-import", "--check"]
note = """
The migration SQL in ci/db/migrate-from-go/generated/ is emitted from metrics/registry.toml
and from the Go view inventory, and it is committed so that a 629-column transform can be
reviewed rather than trusted. That only means anything while the committed copy matches its
inputs: a registry change between review and cutover would otherwise leave an INSERT naming
columns the destination no longer has, and the failure would arrive mid-import.

Separate from codegen-drift on purpose. `codegen --check` says "generated/ matches
metrics/registry.toml" and should keep saying exactly that; this emitter has a second input
describing a frozen tree at a named commit."""

[[gate]]
id = "conformance"
description = "Frozen legacy REST contract replayed against the built Rust binary"
owner = "W1 (frozen contract); runner driven by W3 §1.8"
arms_when = "crates/modernweather/Cargo.toml"
cmd = ["cargo", "xtask", "conformance", "--target-binary", "target/debug/modernweather"]
on_exit.1 = """
the replay reached a verdict and the binary does not serve the frozen contract. Fixtures
failed, and the command's output above names how many and why.

UNTIL implementation-plan.md M4-2 THIS IS THE CORRECT STATE. `crates/modernweather` serves
/metrics and a 404 fallback, so all 70 fixtures fail on the status line. M2-5 armed this
gate precisely so that the failure is visible from Milestone 2 onward rather than
discovered in Milestone 4 (docs/reconciliation.md G-1); M4-2's headline done-criterion is
turning it green. Note that a green replay also requires W1 Decision 10's negative control
to FAIL, which `cargo xtask conformance` runs on its own once the direct replay is clean."""
on_exit.2 = """
the run reached no verdict, so it proved nothing about the contract either way. A missing
tool, a port already in use, a weather database that would not answer, a daemon that would
not start or never asserted its database version, a fixture count that is not 70, failures
at the transport layer, or a negative control that did not hold.

Deliberately NOT exit 1: "nothing was listening" and "the rewrite does not match" produce
the same 70 failures, and reporting the first as the second is the expensive direction for
this gate to lie in. Fix the run, then read its verdict."""
note = """
DESIGN.md R-3 splits into TWO checks, and this gate is only the second of them:

  1. fixture validity  - replay against the GO daemon, proving the fixtures describe
                         reality. Possible today. Gate `conformance-fixtures` below.
  2. rewrite conformance - replay against the RUST daemon, proving the rewrite matches.
                         Impossible until a daemon exists. This gate.

W6 repointed `arms_when`. It previously named `tests/conformance/manifest.toml`, a path
nothing was going to create: W1 shipped the runner as a standalone crate at
contract/conformance/ with 70 fixtures in contract/fixtures/, per W1 Decision 7. So this
gate reported DEFERRED and exited 0 on every PR while the suite it guards -- whose own
"done when" required it to pass -- had never run in CI. See docs/reconciliation.md G-1.

It now arms on the daemon's own manifest, which is what actually makes a Rust-target
replay possible (and is the same path ci/release.toml uses as `crate_manifest`). Arming
it on contract/fixtures/ instead -- W3 §1.8's recommendation -- would arm it immediately
and then fail, because `cargo xtask conformance` does not exist yet and there is no
daemon to target. That is the mirror of the original defect, not its cure.

DESIGN.md D-64: a gate's arms_when must name a path that some work item's done-criteria
require it to create. This one is created by implementation-plan.md M2-1; the xtask
subcommand is M2-5; a green run is M4-2's headline done-criterion.

M2-5 implemented that subcommand, so this gate now fails for the honest reason rather than
for having no runner. Because it is red BY DESIGN until M4-2, M2-5 also took it out of the
`gate` job's `needs` in .github/workflows/pr.yml: a check nobody may merge past for two
milestones is one everybody learns to override, which is G-1 by a different route. The job
still runs and is still visible. **M4-2 puts that line back in the same PR that turns this
gate green**, and that is recorded in M4-2's done-criteria as well as here -- a comment in a
workflow file is not a work item (G-5). A run needs a TimescaleDB through the standard libpq variables and
`psql`, `sqlite3` and `python3` on PATH; it fails rather than skipping when it cannot have
them, because a conformance check that reports green without running is the defect this
gate exists downstream of. See xtask/src/conformance.rs and ci/conformance/README.md."""

[[gate]]
id = "conformance-fixtures"
description = "Frozen legacy REST fixtures replayed against the Go daemon, with a negative control"
owner = "implementation-plan.md M1-4 (work item N-3)"
arms_when = "ci/conformance/go-target.sh"
cmd = ["ci/conformance/go-target.sh"]
note = """
The half of DESIGN.md R-3 that is possible today: point the runner at the GO daemon, which
proves the 70 fixtures describe reality rather than describing what the rewrite happens to
do. ARMED as of implementation-plan.md M1-4; it was declared here deferred by W8 and the
work item that wrote ci/conformance/go-target.sh turned it on, which is the deferred
mechanism used exactly as designed.

W1 Decision 10 is the reason this is not just "replay and check green": a green conformance
run is only accepted alongside a PASSING NEGATIVE CONTROL. The harness replays the fixtures
twice -- once against the daemon, where all 70 must pass, and once through
contract/tools/rig/mangle_proxy.py, where at least 26 must FAIL, at least one must still
pass, and none may fail at the transport layer. A suite that cannot be made to fail proves
nothing, so the second replay failing is a precondition for the gate being green rather
than a diagnostic -- and the last two conditions are what stop "every fixture failed
because nothing was listening" from counting as a control that held.

Run it locally with ci/conformance/README.md's one command; set CONFORMANCE_FORCE_MANGLE=1
to watch the gate go red on demand."""

[[gate]]
id = "db-migrate-twice"
description = "Both schemas apply from empty and from the previous release's snapshot, and a second application is a no-op"
owner = "W4 (database schema); the configuration half is implementation-plan.md M2-2"
arms_when = "migrations"
cmd = ["ci/db/migrate-twice.sh"]
note = """
Two paths, TWO schemas. `migrations/` is the weather schema on PostgreSQL/TimescaleDB and
`migrations/config/` is the configuration schema on SQLite; DESIGN.md D-8 as amended by
A-W6-2 governs both, because "schema changes solely through migrations, no DDL at startup,
no `IF NOT EXISTS`" is about every schema this system owns and not just the weather one.

Until implementation-plan.md M2-2 the second directory did not exist, so this gate was
silent about the database that is the actual instance of the defect D-8 was written about:
the Go configuration store issues `CREATE TABLE IF NOT EXISTS` from a startup path and has
therefore been frozen at first-run shape ever since (docs/reconciliation.md G-2). The gate's
`arms_when` did not change -- `migrations/` already existed -- so this is one of the places
where widening what an armed gate CHECKS is the work item's deliverable rather than arming
a new one.

Three checks on the configuration half, and the order matters:

  1. no conditional DDL under migrations/, with line comments stripped so that a migration
     SAYING "no IF NOT EXISTS, deliberately" is not reported as using it. This runs first and
     needs no database, because the other two are meaningless without it.

     TWO scopes. Repo-wide: `IF NOT EXISTS` and `if_not_exists`, which is M2-2's criterion
     verbatim and which both schemas satisfy. Under migrations/config/ also `OR REPLACE` and
     `IF EXISTS`, because that schema is written from scratch and has no use for either --
     whereas `cargo xtask codegen` emits `CREATE OR REPLACE FUNCTION mw_mean` and `cargo
     xtask migrate` emits `DROP MATERIALIZED VIEW IF EXISTS ... CASCADE`, so forbidding them
     repo-wide would be a rule this repository's own generator cannot satisfy.
     crates/mw-store/src/config_db.rs enforces the same pair.
  2. the same two-path comparison as the weather schema: empty -> HEAD against previous
     release -> seeded rows -> HEAD, compared over sqlite_master.
  3. the applier run AGAIN over a schema already at HEAD: no migration may run, the schema
     may not change, and ci/db/config-seed.sql's rows must survive. Then the converse --
     every migration BODY re-applied directly, which must fail. A body that re-applies
     cleanly means check 3 is green because the DDL is conditional rather than because the
     ledger held, which is D-64's reasoning applied to a property instead of a path.

See docs/release.md §2 for why the weather comparison is schema-and-aggregate equivalence
rather than the union-view assertions the W8 prompt asked for: DESIGN.md D-5 rejected the
union-view scheme, so there are no union views to assert on.

The daemon applies the configuration migrations with `sqlx::migrate` through
`mw_store::config_db`, whose own tests drive that real migrator over the same files. This
script shells out to sqlite3 instead, because it must stay runnable with no Rust toolchain
and because an applier that is not the one under test is a second opinion rather than a
duplicate."""

[[gate]]
id = "driver-emulators"
description = "Go emulators driven against the Rust station drivers"
owner = "W2a §4a (station drivers)"
arms_when = "tests/emulators/manifest.toml"
cmd = ["cargo", "xtask", "emulator-tests"]
note = """
The emulators stay in Go on purpose (DESIGN.md D-40): an independently written emulator is
a stronger oracle than one written alongside the driver, and A-W8-4 adds that they are
consumed at a pinned commit of the reference repository.

Which emulators run, which are still pending, and where each one lives is
tests/emulators/manifest.toml -- and it is worth knowing before reading a green run that
the reference repository has NO WeatherLink Live emulator at the pinned commit, so the one
this gate runs today lives in THIS repository and is therefore not independently authored.
The manifest records that in full, `cargo xtask emulator-tests` prints it on every run, and
it is the programme owner's to resolve. The runner asserts that the declared number of
tests passed, because a filter that matches no tests exits zero and a gate that reports
green while running nothing is docs/reconciliation.md G-1."""

[[gate]]
id = "coverage-ratchet"
description = "Line coverage has not decreased against the committed floor"
owner = "W8 (this item); becomes meaningful once there are tests"
arms_when = "ci/coverage-floor.txt"
cmd = ["cargo", "xtask", "coverage", "--check"]
note = """
A ratchet, not a threshold. DESIGN.md's prompt for this item is explicit that a fixed
target invites tests written to hit a number; a floor that can only rise cannot be
gamed downward and needs no arbitrary target."""

[[gate]]
id = "layout"
description = "Crate layer order, forbidden dependencies and template escaping"
owner = "W3 §1.4 (implementation-plan.md M2-1)"
arms_when = "crates/mw-types/Cargo.toml"
cmd = ["cargo", "xtask", "gate-layout"]
note = """
W3 Decision 1's entire argument for eighteen crates rather than one is that "forbidden to
depend on" is only enforceable as a Cargo.toml fact. That covers the dependency edges.
It does NOT cover the rest of W3 Decision 11, which this gate is the only enforcement of:
the layer order, each crate's forbidden list, "only mw-types mentions generated/", "only
mw-http binds a socket", "only the binary depends on anyhow", and W3 Decision 81's rule
that no template under crates/mw-web/templates/ may use `safe` or `escape("none")`.

Declared here by W6 because W3 assumption 55 named it and, having written no code, could
not declare it -- and an undeclared gate is how a decision becomes a code-review
preference. See docs/reconciliation.md G-4.

M2-1's done-criteria require this gate to be seen FAILING (add a forbidden dependency to
a scratch manifest, assert rejection) before it is trusted. A boundary gate nobody has
watched fail is docs/reconciliation.md G-1 again."""

[[gate]]
id = "db-tests"
description = "Tests that need a real TimescaleDB, which fail rather than skip"
owner = "W3 §8.2 (implementation-plan.md M3-3)"
arms_when = "crates/mw-store/tests/db.rs"
cmd = ["cargo", "xtask", "db-tests"]
on_exit.1 = """
the tests ran against a real server and the write path does not do what M3-3's done-criteria
say it does. Read the libtest output above: it names which of the declared tests failed and
what it asserted."""
on_exit.2 = """
the run reached no verdict, so it proved nothing about the write path either way. No
reachable server, a target that would not build, migrations/ that `sqlx::migrate` would not
apply, or a declared-test-set mismatch -- `xtask/src/dbtests.rs`'s DECLARED and the
`#[test]` functions in crates/mw-store/tests/db.rs have to be the same set, and a renamed
test is a test this gate no longer knows it is running.

Deliberately NOT exit 1, following the `conformance` gate's precedent for the same reason
(docs/reconciliation.md C-W2-20): "there was no database" and "the writer stores a zero
where it should store NULL" otherwise produce the same red, and reporting the first as the
second is the expensive direction for this gate to lie in.

Point it at a server with PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE, or set
MW_DB_TESTS_URL. CI runs it in the `db-tests` job against timescale/timescaledb-ha:pg17
(DESIGN.md D-2); `PGDATABASE` defaults to `postgres`, which is the database that image
creates."""
note = """
W3 Decision 84: database tests FAIL CI if they skip, so "green because it did not run" is
unreachable. That is the exact failure mode docs/reconciliation.md G-1 documents, named as
a decision in one document and -- until now -- undeclared in the manifest that enforces it.

Note the contrast with contract/conformance/tests/conformance.rs, which self-skips when
CONFORMANCE_BASE_URL is unset. That is correct for a crate that must stay green in a
checkout with no server, and it is why the conformance gates above drive the BINARY rather
than relying on `cargo test` to notice.

Declared by W6 per W3 assumption 55. See docs/reconciliation.md G-4.

ARMED as of implementation-plan.md M3-3, which wrote crates/mw-store/tests/db.rs -- the
deferred mechanism used exactly as designed. It is the second of G-4's four gates to arm
itself from the work item that created its subject (`layout` was the first; `ui-bundle` and
`ui-copy` are still deferred to M7-3).

Three checks, because there are three ways a test suite reports green without running, and
closing two of them is not enough:

  1. the tests PANIC rather than skip when MW_DB_TESTS_URL is unset, which is Decision 84
     literally. They are also `#[ignore]`d, so the `test` job -- which has no service
     container -- stays green and honest.
  2. `#[ignore]` means a filter that matched nothing exits ZERO, so `cargo xtask db-tests`
     compares the test binary's own `--list` against a declared set of NAMES, in both
     directions. Names rather than a count, because `xtask/src/emulators.rs` learned the
     expensive way that a count catches a deleted test and does not catch a rename.
  3. Names do not catch a GUTTED BODY -- a test emptied to `{}` still lists, still prints
     `... ok` and still counts, which is the hole emulators.rs documents and does not
     close. So each test ends by calling a helper that RUNS A QUERY and appends its own
     name to an evidence file the gate creates, and the gate requires one line per declared
     test. Verified by doing it: with one body emptied, libtest reported `9 passed` and the
     gate exited 2 naming the gutted test."""

[[gate]]
id = "mgmt-schema-drift"
description = "The management OpenAPI schema and its TypeScript client match the Rust handlers"
owner = "W5 §4.3 (implementation-plan.md M7-1)"
# Repointed by implementation-plan.md M2-1. It previously named
# `crates/mw-api-mgmt/Cargo.toml`, which M2-1 creates as one of W3 §1.2's eighteen stubs --
# so this gate would have armed at M2-1 and failed from there until M7-1, because
# `cargo xtask mgmt-schema` does not exist and neither does the schema it checks. That is
# the mirror of the defect W6 fixed on the `conformance` gate above, and M7-1's own
# done-criterion is "`mgmt-schema-drift` is armed and green", which only reads correctly if
# the gate arms at M7-1. It now names the gate's actual subject: the committed schema, which
# W5 §4.3 places at generated/openapi/management.json and M7-1 creates.
#
# Note the deliberate contrast with `conformance`, which M2-1 DOES arm into a failing state.
# That is sanctioned by M2-1's own note -- the conformance suite exists, has 70 fixtures, and
# a visible red from M2 onward is the point (G-1). Here there is nothing to replay and no
# runner, so a red would carry no information for five milestones.
arms_when = "generated/openapi/management.json"
cmd = ["cargo", "xtask", "mgmt-schema", "--check"]
note = """
Separate from codegen-drift on purpose, following legacy-import-drift's precedent exactly.

W5 assumption 36 expected generated/openapi/management.json and the TypeScript client to
ride the existing codegen-drift gate. W9 Decision 20 had already settled the opposite
principle for the same situation and gave the reason: `cargo xtask codegen --check` should
keep meaning precisely "generated/ matches metrics/registry.toml", because that is the
sentence a reviewer relies on when a PR touches generated code. This emitter has a
different input -- the Rust handler set, via utoipa -- so it gets its own gate.

DESIGN.md D-57. See docs/reconciliation.md C-W5-36.

Needs the same "assert the check left the tree clean" step in pr.yml that codegen-drift
and legacy-import-drift both have (DESIGN.md R-2): a check that writes its own fix into
the tree always passes."""

[[gate]]
id = "ui-bundle"
description = "The management UI's bundle is inside its budget"
owner = "W5 §6.5 (implementation-plan.md M7-3)"
arms_when = "ui/budget.toml"
cmd = ["cargo", "xtask", "gate-ui-bundle"]
note = """
W5 Decision 50: 150 KB gzipped initial route, 280 KB all routes, 60 KB largest lazy chunk,
plus a separate 45 KB font line. W5 Decision 51 names the three things the current UI does
that this budget exists to prevent: no date library, no CDN, no chart library.

Declared by W6 per W5 assumption 43. See docs/reconciliation.md G-4."""

[[gate]]
id = "ui-copy"
description = "No internal term reaches a user-facing string"
owner = "W5 §6.6 (implementation-plan.md M7-3)"
arms_when = "ui/src/lib/copy/index.ts"
cmd = ["cargo", "xtask", "gate-ui-copy"]
note = """
DESIGN.md D-36 says an internal term on screen is a bug rather than a documentation gap,
which is the right standard with no mechanism behind it. A-W5-2 exists to give it one:
user-facing strings live in a single copy module and this gate fails the build on a banned
internal term, printing the current exception list on every run so a deliberate exception
is visible rather than silent.

W5's own words on why the mechanism is the decision: every team that has written that
sentence has also shipped the term. Without this gate D-36 degrades into a code-review
preference within a release or two.

Declared by W6 per W5 assumption 43. See docs/reconciliation.md G-4."""
